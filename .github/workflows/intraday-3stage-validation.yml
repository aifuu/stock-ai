name: TOP3 5分足 3段階自動検証

on:
  workflow_run:
    workflows: ["AI Stock Scan + Auto Strategy Validation"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile intraday_strategy_backtest.py
          python -m py_compile intraday_top3_backtest.py
          python -m py_compile intraday_3stage_validation.py
          python -m py_compile build_intraday_policy.py

      - name: Run three-stage validation
        env:
          TOP3_HISTORY_FILE: prediction_history.csv
          IS_START_DATE: '2026-08-01'
          IS_END_DATE: '2026-08-22'
          IT_ATR_TP: '2.0'
          IT_ATR_SL: '1.0'
          AUTO_ENTRY_ATR_TP: '2.0'
          AUTO_ENTRY_ATR_SL: '1.0'
          AUTO_ENTRY_MAX_GAP: '5.0'
        run: python intraday_strategy_backtest.py

      - name: Check comparison output
        run: |
          echo "===== intraday_strategy_comparison.csv ====="
          ls -lh intraday_strategy_comparison.csv
          python - <<'PY'
          import os
          import pandas as pd
          file = 'intraday_strategy_comparison.csv'
          if not os.path.exists(file):
              raise SystemExit('❌ intraday_strategy_comparison.csv がありません')
          df = pd.read_csv(file)
          print(df.to_string(index=False))
          required = {'strategy','trades','pf','win_rate','avg_return_pct'}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f'❌ 必須列不足: {sorted(missing)}')
          PY

      - name: Select best intraday strategy
        run: |
          python build_intraday_policy.py

      - name: Show active intraday policy
        run: |
          echo "===== ACTIVE INTRADAY POLICY ====="
          if [ -f strategy_policy.json ]; then
            python - <<'PY'
            import json
            with open('strategy_policy.json', encoding='utf-8') as f:
                p = json.load(f)
            keys = [
                'intraday_strategy', 'intraday_min_score',
                'intraday_min_up_prob', 'intraday_min_vol_ratio',
                'intraday_atr_tp', 'intraday_atr_sl',
                'intraday_trades', 'intraday_pf',
                'intraday_win_rate', 'intraday_avg_return_pct',
                'intraday_total_return_pct', 'intraday_max_dd_pct',
            ]
            for k in keys:
                if k in p:
                    print(f'{k}: {p[k]}')
            PY
          else
            echo '⚠ strategy_policy.json がありません'
          fi

      - name: Build display summary
        run: |
          python - <<'PY'
          import pandas as pd
          src = pd.read_csv('intraday_strategy_comparison.csv')
          src.to_csv('intraday_3stage_summary.csv', index=False, encoding='utf-8-sig')
          print('✅ intraday_3stage_summary.csv 作成')
          PY

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intraday-3stage-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            intraday_strategy_comparison.csv
            intraday_3stage_summary.csv
            intraday_top3_backtest_results.csv
            intraday_top3_equity.csv
            strategy_policy.json

      - name: Commit validation and intraday policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday_strategy_comparison.csv intraday_3stage_summary.csv strategy_policy.json || true
          if git diff --cached --quiet; then
            echo '検証結果・デイトレpolicy変更なし'
          else
            git commit -m 'chore: update intraday strategy validation and policy' || true
            PUSH_SUCCESS=false
            for i in 1 2 3; do
              if git push; then
                echo '✅ push成功'
                PUSH_SUCCESS=true
                break
              fi
              echo "⚠ push失敗、再試行 ($i/3)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
            if [ "$PUSH_SUCCESS" != 'true' ]; then
              echo '❌ 3回ともpush失敗'
              exit 1
            fi
          fi
