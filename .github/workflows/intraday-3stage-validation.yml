name: TOP3 5分足 3段階自動検証

on:
  schedule:
    # JST 07:00 = UTC 22:00 (前日)
    - cron: '0 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile intraday_strategy_backtest.py
          python -m py_compile build_intraday_policy.py
          python -m py_compile intraday_auto_entry_monitor.py
          python -m py_compile intraday_exit_monitor.py

      - name: Run three-stage validation using existing prediction history
        env:
          TOP3_HISTORY_FILE: prediction_history.csv
          IS_START_DATE: '2026-08-01'
          IS_END_DATE: '2026-08-22'
          IS_MIN_TRADES: '10'
          IT_ATR_TP: '2.0'
          IT_ATR_SL: '1.0'
          AUTO_ENTRY_ATR_TP: '2.0'
          AUTO_ENTRY_ATR_SL: '1.0'
          AUTO_ENTRY_MAX_GAP: '5.0'
        run: python intraday_strategy_backtest.py

      - name: Check comparison output
        run: |
          test -s intraday_strategy_comparison.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv('intraday_strategy_comparison.csv')
          required = {'strategy','trades','pf','win_rate','avg_return_pct','total_return_pct','max_dd_pct','final_capital'}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f'❌ 必須列不足: {sorted(missing)}')
          print(df.to_string(index=False))
          PY

      - name: Select best intraday strategy
        env:
          ID_MIN_TRADES: '10'
          ID_MIN_PF: '1.0'
          ID_MIN_AVG_RETURN: '0.0'
          AUTO_ENTRY_ATR_TP: '2.0'
          AUTO_ENTRY_ATR_SL: '1.0'
        run: python build_intraday_policy.py

      - name: Show active intraday policy
        run: |
          echo '===== ACTIVE INTRADAY POLICY ====='
          test -s strategy_policy.json
          python - <<'PY'
          import json
          with open('strategy_policy.json', encoding='utf-8') as f:
              p = json.load(f)
          for k in [
              'intraday_strategy','intraday_min_score','intraday_min_up_prob',
              'intraday_min_vol_ratio','intraday_atr_tp','intraday_atr_sl',
              'intraday_trades','intraday_pf','intraday_win_rate',
              'intraday_avg_return_pct','intraday_total_return_pct','intraday_max_dd_pct'
          ]:
              if k in p:
                  print(f'{k}: {p[k]}')
          PY

      - name: Build display summary
        run: cp intraday_strategy_comparison.csv intraday_3stage_summary.csv

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intraday-3stage-validation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            intraday_strategy_comparison.csv
            intraday_3stage_summary.csv
            strategy_policy.json

      - name: Commit validation and intraday policy safely
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday_strategy_comparison.csv intraday_3stage_summary.csv strategy_policy.json
          git commit -m 'chore: update intraday strategy validation and policy' || echo '変更なし'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo '❌ validation rebase conflict'
              exit 1
            }
            if git push origin HEAD:main; then
              echo '✅ validation push成功'
              exit 0
            fi
            echo "⚠️ validation push競合、再試行: $i/5"
            sleep $((i * 3))
          done
          echo '❌ validation push失敗'
          exit 1
