name: Fold 4 UP Probability Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      # ★修正(2026-09): walk_forward_all_candidates.csvはGitHubのpushサイズ上限を
      # 避けるため、git管理はgzip圧縮版(walk_forward_all_candidates.csv.gz)のみに
      # 切り替えた(refresh-walk-forward-candidates.yml参照)。checkout直後にここで
      # 展開しておけば、fold4_up_probability_diagnostic.pyは従来通りプレーンCSVを
      # 読める。
      - name: Materialize candidates CSV from compressed git storage
        run: |
          if [ ! -s walk_forward_all_candidates.csv ] && [ -f walk_forward_all_candidates.csv.gz ]; then
            gunzip -k walk_forward_all_candidates.csv.gz
          fi

      - name: Run Fold 4 UP probability diagnostic
        run: python fold4_up_probability_diagnostic.py

      - name: Show diagnostic CSV
        run: |
          test -s fold4_up_probability_diagnostic.csv
          cat fold4_up_probability_diagnostic.csv

      - name: Commit diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold4_up_probability_diagnostic.csv
          git commit -m 'diagnostic: Fold 4 UP probability distribution [skip ci]' || echo '変更なし'
          git push origin HEAD:main || true
