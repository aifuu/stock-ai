name: Nikkei MACD Dip Paper Trade (Experimental, Separate Track)

on:
  workflow_dispatch: {}
  # ★決定(schedule:トリガーは撤廃、2026-09-29のインシデントを受けて):
  # 以前はここに5本のcron(JST 09:35/11:15/12:40/14:00/15:15を狙った
  # UTC指定)があったが、このリポジトリの実運用ではGitHub Actionsの
  # schedule実行が4.5〜7.8時間(中央値で約5時間45分)遅延することが実測で
  # 判明している。is_trading_window()の場中判定ウィンドウ(JST 9:00〜15:20)
  # は5本とも大きく外れた時刻に発火するため、ほぼ毎回「場中(平日 09:00〜
  # 15:20 JST)以外のため判定スキップ」に自己スキップするだけの実質何もしない
  # 実行になっていた(=このワークフローは実質ずっと停止していたのと同じ)。
  # scheduleそのものが遅延の主因であり修正できないため、この枠のschedule
  # トリガーは完全に撤廃する。実行はクラウド側のルーチンが本来の5チェック
  # ポイント(JST 09:35/11:15/12:40/14:00/15:15)でworkflow_dispatchする運用
  # に一本化した。
  #
  # nikkei_macd_dip_paper.py側の安全性(このスケジュール撤廃・dispatch一本化
  # に伴う二重発火対策として確認済み):
  #   - is_trading_window()はdatetime.now(ZoneInfo("Asia/Tokyo"))で計算した
  #     JST時刻・曜日・common.is_tse_trading_day()の祝日判定を使っており、
  #     常にJST基準(全チェックポイントがUTC・JST同日内でmidnightをまたがない
  #     ため、all_candidates_paper.pyのような日付またぎ誤処理は起こらない)。
  #   - 新規エントリーは「ポジション未保有 かつ その日まだ決済していない
  #     (last_exit_date != today)」の場合のみ行われ、状態(position/
  #     last_exit_date)はrunのたびにgit checkoutで最新のmainから読み直す。
  #     下のconcurrencyグループ(cancel-in-progress: false)により同一
  #     ワークフローの複数run(2回のdispatchが1分差で来た場合や手動runを
  #     含む)は並走せず必ず直列実行される(1つ目が完了してから2つ目が
  #     チェックアウトする)ため、直後に重複dispatchされても2つ目は1つ目が
  #     コミットした最新state(position/last_exit_dateを含む)を読んでから
  #     判定するので、同日中の二重エントリー・二重決済は起こらない
  #     (test_nikkei_macd_dip_paper_duplicate_run.py で回帰テスト済み)。

permissions:
  contents: write

# 本番ワークフロー(ai-stock-scan.yml等)とはconcurrencyグループを共有しない
# 完全に独立したセカンドトラック。
concurrency:
  group: stock-ai-nikkei-macd-dip-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile nikkei_macd_dip_paper.py

      - name: Run Nikkei MACD dip paper trade
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INTRADAY_FEE_RATE: '0.00055'
        run: python nikkei_macd_dip_paper.py

      - name: Persist state (commit & push)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            nikkei_macd_dip_paper_state.json nikkei_macd_dip_paper_history.csv \
            nikkei_macd_dip_paper_state_top.json nikkei_macd_dip_paper_history_top.csv nikkei_macd_dip_paper_history_top.recovery.csv \
            nikkei_macd_dip_paper_state_mid.json nikkei_macd_dip_paper_history_mid.csv nikkei_macd_dip_paper_history_mid.recovery.csv \
            nikkei_macd_dip_paper_state_bottom.json nikkei_macd_dip_paper_history_bottom.csv nikkei_macd_dip_paper_history_bottom.recovery.csv \
          ; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist nikkei-macd-dip paper trading state [skip ci]'
            PUSH_OK=0
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase --autostash origin/main && git push origin HEAD:main; then
                echo '✅ push成功'
                PUSH_OK=1
                break
              fi
              git rebase --abort || true
              sleep $((i*3))
            done
            if [ "$PUSH_OK" -ne 1 ]; then
              echo '❌ push失敗'
              exit 1
            fi
          else
            echo 'ℹ️ 変更なし、pushスキップ'
          fi

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-macd-dip-paper-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            nikkei_macd_dip_paper_state.json
            nikkei_macd_dip_paper_history.csv
            nikkei_macd_dip_paper_state_top.json
            nikkei_macd_dip_paper_history_top.csv
            nikkei_macd_dip_paper_state_mid.json
            nikkei_macd_dip_paper_history_mid.csv
            nikkei_macd_dip_paper_state_bottom.json
            nikkei_macd_dip_paper_history_bottom.csv
