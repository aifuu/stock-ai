name: Nikkei MACD Dip Paper Trade (Experimental, Separate Track)

on:
  schedule:
    # 場中(JST 9:00〜15:20、昼休み11:30〜12:30は除く)に1日5回判定。
    # 終値ベースのエントリーは実際には約定できない価格だったため、場中の
    # 現在価格で売買判定するよう変更(UTC・JSTは同日内のため日またぎなし)。
    - cron: '35 0 * * 1-5'  # JST 09:35
    - cron: '15 2 * * 1-5'  # JST 11:15
    - cron: '40 3 * * 1-5'  # JST 12:40
    - cron: '0 5 * * 1-5'   # JST 14:00
    - cron: '15 6 * * 1-5'  # JST 15:15
  workflow_dispatch: {}

permissions:
  contents: write

# 本番ワークフロー(ai-stock-scan.yml等)とはconcurrencyグループを共有しない
# 完全に独立したセカンドトラック。
concurrency:
  group: stock-ai-nikkei-macd-dip-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile nikkei_macd_dip_paper.py

      - name: Run Nikkei MACD dip paper trade
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INTRADAY_FEE_RATE: '0.00055'
        run: python nikkei_macd_dip_paper.py

      - name: Persist state (commit & push)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            nikkei_macd_dip_paper_state.json nikkei_macd_dip_paper_history.csv \
            nikkei_macd_dip_paper_state_top.json nikkei_macd_dip_paper_history_top.csv \
            nikkei_macd_dip_paper_state_mid.json nikkei_macd_dip_paper_history_mid.csv \
            nikkei_macd_dip_paper_state_bottom.json nikkei_macd_dip_paper_history_bottom.csv \
          ; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist nikkei-macd-dip paper trading state [skip ci]'
            PUSH_OK=0
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase --autostash origin/main && git push origin HEAD:main; then
                echo '✅ push成功'
                PUSH_OK=1
                break
              fi
              git rebase --abort || true
              sleep $((i*3))
            done
            if [ "$PUSH_OK" -ne 1 ]; then
              echo '❌ push失敗'
              exit 1
            fi
          else
            echo 'ℹ️ 変更なし、pushスキップ'
          fi

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-macd-dip-paper-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            nikkei_macd_dip_paper_state.json
            nikkei_macd_dip_paper_history.csv
            nikkei_macd_dip_paper_state_top.json
            nikkei_macd_dip_paper_history_top.csv
            nikkei_macd_dip_paper_state_mid.json
            nikkei_macd_dip_paper_history_mid.csv
            nikkei_macd_dip_paper_state_bottom.json
            nikkei_macd_dip_paper_history_bottom.csv
