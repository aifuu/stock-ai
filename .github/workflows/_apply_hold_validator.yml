name: Apply 1d 3d 5d validator rule
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'force daily TOP1 into 1d 3d 5d paper buckets')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch validator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('adversarial_strategy_validator.py')
          s=p.read_text(encoding='utf-8')
          old='HOLD_DAYS_LIST = [3, 5, 7]'
          if old in s:
              s=s.replace(old,'HOLD_DAYS_LIST = [1, 3, 5]',1)
              p.write_text(s,encoding='utf-8')
              print('patched')
          else:
              print('already patched')
          PY
          python -m py_compile adversarial_strategy_validator.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add adversarial_strategy_validator.py
          git commit -m 'feat: validate 1d 3d 5d hold periods'
          git push origin HEAD:main
