name: OOS Accounting Real-Data Preview (read-only, no policy)

# 一時的なdispatch専用スカフォールド(このファイル自体はmain上でのみ存在)。
# fix/oos-preview-realdata ブランチにある本体ワークフロー(同名ファイル、
# 内容は全く異なる)を実データで検証するためだけに置く。
# GitHub Actionsのworkflow_dispatchは「デフォルトブランチにワークフロー
# ファイルが存在する」ことをAPIから検出する必要があるが、
# ref=fix/oos-preview-realdata を指定してdispatchすると、実際に実行される
# 定義はそのref上の内容になる(mainのこのスタブは実行されない)。
# 万一このファイル自体(main上のスタブ)が誤ってdispatchされても、
# 何もしないno-opジョブが動くだけで安全。
#
# 安全設計: schedule無し・secret無し・permissions: contents: read のみ・
# 本番(stock-ai-profit-optimizer)や本体ワークフローの検証用concurrency
# group(stock-ai-oos-accounting-preview)とも別名。
# 検証完了後、このファイルと検証ブランチ(fix/oos-preview-realdata)を削除する。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-ai-oos-accounting-preview-scaffold
  cancel-in-progress: false

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'scaffold only (main) - real workflow lives on fix/oos-preview-realdata branch'
