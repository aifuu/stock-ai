name: Fold 4 OOS Filter Funnel Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fold4_oos_filter_trace.py'
      - '.github/workflows/fold4-filter-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: stock-ai-fold4-filter-diagnostic
  cancel-in-progress: false

env:
  WF_START_DATE: '2018-01-01'
  WF_MULTI_OOS_DAYS: '239'
  # ★修正(2026-09): 実際のゲート(adversarial_strategy_validator.py等)をTOP1に
  # 合わせたため、この診断も同じ基準に揃える。
  WF_TOP_N: '1'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      # ★修正(2026-09): refresh-walk-forward-candidates.ymlと同じ理由で、
      # WF_END_DATEの固定リテラルをやめ実行日を毎回使う。
      - name: Compute current WF_END_DATE
        run: |
          echo "WF_END_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Syntax check
        run: python -m py_compile fold4_oos_filter_trace.py

      # ★変更(2026-09): walk_forward_all_candidates.csv.gzはもうgit管理対象
      # ではなく、GitHub Release(walk-forward-candidates-latest)のアセットとして
      # 配布される(refresh-walk-forward-candidates.yml参照)。checkout直後に
      # releaseからダウンロードし、ダウンロードに失敗した場合のみ、まだgit管理
      # 下に残っている可能性のある.gz(移行期のフォールバック)を使う。どちらも
      # 無ければジョブを失敗させる。
      - name: Materialize candidates CSV from release or compressed git storage
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            GZ_FROM_GIT=0
            [ -f walk_forward_all_candidates.csv.gz ] && GZ_FROM_GIT=1
            DOWNLOADED=0
            for i in 1 2 3; do
              if curl -fL -o walk_forward_all_candidates.csv.gz.tmp \
                "https://github.com/aifuu/stock-ai/releases/download/walk-forward-candidates-latest/walk_forward_all_candidates.csv.gz"; then
                mv -f walk_forward_all_candidates.csv.gz.tmp walk_forward_all_candidates.csv.gz
                DOWNLOADED=1
                break
              fi
              rm -f walk_forward_all_candidates.csv.gz.tmp
              echo "⚠️ release資産のダウンロード失敗 (試行${i}/3)"
              sleep $((i * 5))
            done
            if [ "$DOWNLOADED" != "1" ]; then
              if [ "$GZ_FROM_GIT" = "1" ]; then
                echo '⚠️ releaseダウンロードに失敗したため、git管理下の.gz(移行期のフォールバック)を使用します'
              else
                echo '❌ walk_forward_all_candidates.csv.gzが見つかりません(release資産のダウンロードに失敗し、git管理下のフォールバックも存在しません)'
                exit 1
              fi
            fi
            gunzip -k walk_forward_all_candidates.csv.gz
          fi
          test -s walk_forward_all_candidates.csv

      - name: Run exact Fold 4 funnel trace
        run: |
          echo '============================================================'
          echo '🔎 FOLD 4 OOS FILTER FUNNEL DIAGNOSTIC'
          echo '目的: 8,016 → 8 のような件数減少を段階別に特定'
          echo 'ゲート条件・探索閾値・policyは変更しない'
          echo '============================================================'
          python fold4_oos_filter_trace.py

      - name: Show diagnostic CSV
        run: |
          test -s fold4_oos_filter_trace.csv
          cat fold4_oos_filter_trace.csv

      - name: Commit diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fold4_oos_filter_trace.csv
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m 'diagnostic: record exact Fold 4 OOS filter funnel [skip ci]'
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ fold4 filter diagnostic push成功'
              PUSH_OK=1
              break
            fi
            git rebase --abort || true
            sleep $((i*3))
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo '❌ fold4 filter diagnostic push失敗'
            exit 1
          fi

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: fold4-oos-filter-trace-${{ github.run_id }}
          if-no-files-found: error
          path: fold4_oos_filter_trace.csv
