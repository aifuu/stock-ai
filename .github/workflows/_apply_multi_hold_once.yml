name: Apply multi-hold paper rules once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wf=Path('.github/workflows/ai-stock-scan.yml')
          s=wf.read_text(encoding='utf-8')
          old='          python paper_fast_entrypoint.py\n\n      - name: Verify TOP10 paper state'
          new='          python multi_hold_paper.py\n\n      - name: Verify 1/3/5-day forced paper state'
          if old not in s:
              raise SystemExit('target paper entry command not found')
          s=s.replace(old,new,1)
          old_check="""          import json\n          from pathlib import Path\n          p=Path('profit_top10_paper_state.json')\n          if not p.exists(): raise SystemExit('❌ 09:30以降なのにpaper stateがありません')\n          s=json.loads(p.read_text(encoding='utf-8')); positions=s.get('positions',[])\n          if len(positions)>10: raise SystemExit(f'❌ TOP10超過: {len(positions)}')\n          if int(s.get('trades_today',0))>30: raise SystemExit(f'❌ 1日30回超過: {s.get(\"trades_today\")}')\n          print(f'✅ 仮想資産: {float(s.get(\"capital\",0)):,.0f}円')\n          print(f'✅ 最大DD: {float(s.get(\"max_dd\",0)):.2f}%')\n          print(f'✅ 保有ポジション: {len(positions)}/10')\n          print(f'✅ 本日新規: {int(s.get(\"trades_today\",0))}/30')"""
          new_check="""          import json\n          from pathlib import Path\n          p=Path('multi_hold_paper_state.json')\n          if not p.exists(): raise SystemExit('❌ 09:30以降なのにmulti-hold stateがありません')\n          s=json.loads(p.read_text(encoding='utf-8')); positions=s.get('positions',[])\n          if int(s.get('trades_today',0)) not in (0,3): raise SystemExit(f'❌ 本日のバケット数不正: {s.get(\"trades_today\")}')\n          print(f'✅ 1日資産: {float(s.get(\"capitals\",{}).get(\"1\",0)):,.0f}円')\n          print(f'✅ 3日資産: {float(s.get(\"capitals\",{}).get(\"3\",0)):,.0f}円')\n          print(f'✅ 5日資産: {float(s.get(\"capitals\",{}).get(\"5\",0)):,.0f}円')\n          print(f'✅ 保有バケット: {len(positions)}')\n          if positions:\n              tickers={p.get('ticker') for p in positions}\n              if len(tickers)!=1: raise SystemExit(f'❌ 同一銘柄ルール違反: {tickers}')\n              holds={p.get('hold_days') for p in positions}\n              if not holds.issubset({1,3,5}): raise SystemExit(f'❌ 保有日数不正: {holds}')"""
          if old_check not in s:
              raise SystemExit('old verification block not found')
          s=s.replace(old_check,new_check,1)
          old_ledger="""          for f in profit_top10_paper_state.json profit_top10_paper_history.csv profit_top10_monthly_performance.csv intraday_scheduler_state.json; do"""
          new_ledger="""          for f in multi_hold_paper_state.json multi_hold_paper_history.csv profit_top10_paper_state.json profit_top10_paper_history.csv profit_top10_monthly_performance.csv intraday_scheduler_state.json; do"""
          s=s.replace(old_ledger,new_ledger,1)
          old_art="""            profit_top10_paper_state.json\n            profit_top10_paper_history.csv\n            profit_top10_monthly_performance.csv"""
          new_art="""            multi_hold_paper_state.json\n            multi_hold_paper_history.csv\n            profit_top10_paper_state.json\n            profit_top10_paper_history.csv\n            profit_top10_monthly_performance.csv"""
          s=s.replace(old_art,new_art,1)
          old_syntax='paper_fast_entrypoint.py paper_profit_entrypoint.py'
          new_syntax='paper_fast_entrypoint.py multi_hold_paper.py paper_profit_entrypoint.py'
          if old_syntax not in s: raise SystemExit('syntax-check target not found')
          s=s.replace(old_syntax,new_syntax,1)
          wf.write_text(s,encoding='utf-8')

          v=Path('adversarial_strategy_validator.py')
          x=v.read_text(encoding='utf-8')
          old='HOLD_DAYS_LIST = [3, 5, 7]'
          if old not in x: raise SystemExit('validator hold list not found')
          x=x.replace(old,'HOLD_DAYS_LIST = [1, 3, 5]',1)
          v.write_text(x,encoding='utf-8')
          PY
          python -m py_compile multi_hold_paper.py adversarial_strategy_validator.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ai-stock-scan.yml adversarial_strategy_validator.py multi_hold_paper.py
          git rm .github/workflows/_apply_multi_hold_once.yml
          git commit -m 'feat: force daily TOP1 into 1d 3d 5d paper buckets'
          git push origin HEAD:main
