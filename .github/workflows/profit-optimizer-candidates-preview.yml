name: AI Profit Optimizer - Candidate Preview (no policy write)

# 一時的な検証専用ワークフロー。
# 目的: 修正済みのstats()(月次reindexで無取引月を正しく0%カウント)で
# DEV -> VALIDATION -> OOSパイプラインを再実行し、候補一覧(CSV)だけを
# artifactとして出力する。
#
# profit-optimizer-validation.ymlとの違い:
#   - schedule トリガーなし(workflow_dispatchのみ、手動実行専用)
#   - "Build verified policy"(build_strategy_policy.py)ステップを実行しない
#   - "Commit optimizer outputs"(git commit/push)ステップを削除
#   - permissions: contents: read のみ(pushしないため write不要)
#   - AI_POLICY_SIGNING_SECRET は渡さない(policy書き込み自体を行わないため不要)
#
# strategy_policy.json は一切生成・上書き・commitしない。
# 探索空間・ゲート条件(adversarial_strategy_validator.py / multi_oos_profit_gate.py)は
# 元のワークフローから一切変更しない。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-ai-profit-optimizer-candidates-preview
  cancel-in-progress: false

env:
  WF_START_DATE: '2018-01-01'
  WF_TOP_N: '1'
  WF_MULTI_OOS_FOLDS: '4'
  WF_MULTI_OOS_DAYS: '239'
  WF_INITIAL_CAPITAL: '1000000'
  WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
  WF_MAX_OOS_DD: '35'
  WF_MIN_POSITIVE_FOLDS: '1'
  WF_MIN_TOTAL_OOS_TRADES: '12'

jobs:
  preview_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile adversarial_strategy_validator.py
          python -m py_compile multi_oos_profit_gate.py
          python -m py_compile adversarial_oos_diagnostic.py

      - name: Build candidates when needed
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            python daily_model_retrain.py
            python walk_forward.py
          fi
          test -s walk_forward_all_candidates.csv

      - name: Run 4 independent OOS profit gate (fixed stats())
        env:
          DISCORD_WEBHOOK: ''
        run: python multi_oos_profit_gate.py

      - name: Build OOS diagnostic input from all Fold results
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('multi_oos_results')
          files = sorted(root.glob('fold_*/adversarial_oos_results.csv'))
          rows = []
          print('============================================================')
          print('🔧 BUILD OOS DIAGNOSTIC INPUT (candidate preview, no policy write)')
          print('============================================================')

          for path in files:
              try:
                  df = pd.read_csv(path)
              except Exception as e:
                  print(f'⚠ 読み込み失敗: {path}: {e}')
                  continue
              if df.empty:
                  print(f'⚠ 空ファイル: {path}')
                  continue
              fold_text = path.parent.name
              try:
                  fold_no = int(fold_text.split('_')[-1])
              except ValueError:
                  print(f'⚠ Fold番号を取得できないためスキップ: {path}')
                  continue
              df = df.copy()
              df['diagnostic_fold'] = fold_no
              rows.append(df)
              print(f'✅ {path}: {len(df)} rows / Fold {fold_no}')

          out = Path('adversarial_multi_oos_folds.csv')
          if rows:
              merged = pd.concat(rows, ignore_index=True, sort=False)
              if 'fold' not in merged.columns:
                  merged['fold'] = merged['diagnostic_fold']
              else:
                  merged['fold'] = pd.to_numeric(merged['fold'], errors='coerce').fillna(merged['diagnostic_fold']).astype(int)
              merged.to_csv(out, index=False, encoding='utf-8-sig')
              print(f'📁 {out}: {len(merged)} rows / {merged["fold"].nunique()} folds')
          else:
              pd.DataFrame().to_csv(out, index=False)
              print(f'⚠ {out}: 診断対象データなし')
          PY

      - name: Run OOS failure diagnosis
        env:
          DISCORD_WEBHOOK: ''
          WF_OOS_FOLDS: '4'
          WF_MIN_POSITIVE_FOLDS: '1'
          WF_MIN_TOTAL_OOS_TRADES: '12'
          WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
          WF_MAX_OOS_DD: '35'
        run: python adversarial_oos_diagnostic.py

      - name: Show top candidates (report only, no policy write)
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path('adversarial_final_candidates.csv')
          print('=' * 70)
          print('🏆 CANDIDATE PREVIEW (fixed stats(), strategy_policy.json is NOT touched)')
          print('=' * 70)
          if not path.exists() or path.stat().st_size == 0:
              print('⚠ adversarial_final_candidates.csv が空、または存在しません(Final PASS 0件)')
          else:
              df = pd.read_csv(path)
              if df.empty:
                  print('⚠ Final PASS 0件')
              else:
                  cols = ['strategy', 'up_threshold', 'score_threshold', 'nikkei_filter',
                          'tp_multiplier', 'sl_multiplier', 'hold_days',
                          'validation_avg_month_return', 'validation_pf', 'validation_signals',
                          'oos_avg_month_return', 'oos_compound_return', 'oos_pf', 'oos_signals',
                          'oos_positive_folds', 'profit_objective']
                  cols = [c for c in cols if c in df.columns]
                  df_sorted = df.sort_values('profit_objective', ascending=False) if 'profit_objective' in df.columns else df
                  print(df_sorted[cols].head(10).to_string(index=False))
          PY

      - name: Upload candidate preview artifacts (strategy_policy.json excluded, not generated)
        uses: actions/upload-artifact@v4
        with:
          name: profit-optimizer-candidate-preview-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            adversarial_dev_all_results.csv
            adversarial_dev_selected_candidates.csv
            adversarial_validation_results.csv
            adversarial_oos_results.csv
            adversarial_final_candidates.csv
            adversarial_multi_oos_folds.csv
            adversarial_oos_diagnostics.csv
            adversarial_oos_near_miss.csv
            multi_oos_folds.csv
            multi_oos_results/**
            multi_oos_fold_funnel.csv
