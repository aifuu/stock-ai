name: Sync Nikkei 225 universe

on:
  push:
    branches: [main]
    # sync_ticker_universe.pyはstock_scan.pyのTICKERSを読み取り、
    # stock_scan.py/walk_forward.pyへ書き戻すだけで、他のどのワークフローも
    # この2ファイルのTICKERS本体を書き換えない(grep済み)。したがって
    # この2ファイル(と本ワークフロー自体)が変わらないpushでは常にno-opに
    # なるため、pathsで対象を絞り毎push実行を避ける。
    paths:
      - stock_scan.py
      - walk_forward.py
      - .github/workflows/sync-ticker-universe.yml
  workflow_dispatch:

permissions:
  contents: write

# Ticker synchronization has its own writer lock so it never blocks
# paper trading, retraining, or OOS profit optimization.
concurrency:
  group: stock-ai-ticker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync tickers
        run: |
          python sync_ticker_universe.py
          python -m py_compile stock_scan.py
          python -m py_compile walk_forward.py

      - name: Show result
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("stock_scan.py", "walk_forward.py"):
              tree = ast.parse(Path(name).read_text(encoding="utf-8"))
              tickers = None
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "TICKERS":
                              tickers = ast.literal_eval(node.value)
              if tickers is None:
                  raise SystemExit(f"❌ {name}: TICKERS が見つかりません")
              print(f"{name}: {len(tickers)}銘柄")
          PY

      - name: Commit synchronized files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_scan.py walk_forward.py
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Sync stock universe to 225 tickers (Nikkei 225) [skip ci]"

          success=0
          for i in 1 2 3 4 5; do
            echo "🔄 main push attempt $i/5"
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo "✅ ticker sync push成功"
              success=1
              break
            fi
            echo "⚠️ push failed, retry $i/5"
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ ticker sync push失敗: 5回とも失敗しました"
            exit 1
          fi
