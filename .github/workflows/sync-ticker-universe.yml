name: Sync 100-stock universe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync tickers
        run: |
          python sync_ticker_universe.py
          python -m py_compile stock_scan.py
          python -m py_compile walk_forward.py

      - name: Show result
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("stock_scan.py", "walk_forward.py"):
              tree = ast.parse(Path(name).read_text(encoding="utf-8"))
              tickers = None
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "TICKERS":
                              tickers = ast.literal_eval(node.value)
              print(f"{name}: {len(tickers)}銘柄")
          PY

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_scan.py walk_forward.py
          git diff --cached --quiet || git commit -m "Sync stock universe to 100 tickers [skip ci]"
          git push
