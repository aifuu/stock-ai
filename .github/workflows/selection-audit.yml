name: Selection Audit - 430 to TOP1

on:
  schedule:
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stock-ai-selection-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Apply expanded stock universe
        run: |
          python apply_expanded_universe.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          vals=[]
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
          print(f'✅ Audit runtime universe = {len(vals)}銘柄')
          if len(vals) < 250: raise SystemExit('❌ 拡張ユニバースが250未満')
          PY

      - name: Syntax check
        run: |
          python -m py_compile selection_audit.py daily_directional_top1.py profit_top10_paper.py

      - name: Run selection audit
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          AI_INITIAL_CAPITAL: '1000000'
          PAPER_TRADE_MODE: '1'
        run: python selection_audit.py

      - name: Upload selection audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: selection_audit.csv
