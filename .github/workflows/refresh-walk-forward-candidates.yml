name: Refresh Walk-Forward Candidates

on:
  workflow_dispatch:
  # ★修正(2026-09): branchesフィルタが無く、checkoutステップはref: mainに
  # 固定されている(このpushトリガー自体もこのファイルを変更した任意のブランチの
  # pushで発火する)。そのため任意のブランチでこのymlを編集してpushするだけで、
  # 本番main相手にrm -f→再生成→commit→push(main直push)まで実際に走ってしまう
  # (実測: verify/train-data-csv-gz上のcommit 1fd7f0aのpushでrun 35424820890が
  # このパスで発火し、mainをcheckoutしてローカルcommitまで作成、git rebase時に
  # 未追跡のtrain_data.csv(git rm --cachedで追跡除外した直後の作業ツリー残留物)が
  # 衝突して5回とも失敗しただけで、たまたまmainへのpushには至らなかった)。
  # mainへの実際のマージ後にワークフロー編集の疎通確認をする、という本来の意図に
  # 合わせ、mainへのpush時のみ発火するよう限定する。
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-walk-forward-candidates.yml'
  schedule:
    - cron: '0 22 * * 5'

permissions:
  contents: write

concurrency:
  group: stock-ai-refresh-candidates
  cancel-in-progress: false

env:
  WF_START_DATE: '2018-01-01'
  WF_TOP_N: '10'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile daily_model_retrain.py
          python -m py_compile walk_forward.py
          python -m py_compile walk_forward_fast_runner.py

      # ★修正(2026-09): WF_END_DATEが'2026-08-22'に固定されていたため、
      # 毎週このワークフローが走っても候補CSVの終端が一切進まず、
      # Fold-4（最新OOS窓）が実質2週間以上前のデータで固定化されていた
      # （実測: walk_forward_all_candidates.csvの最終日が2026-08-20のまま
      # 2026-08-30・2026-09-04の2回のrefresh後も不変だった）。
      # 固定リテラルをやめ、実行のたびに当日日付を終端として使う。
      - name: Compute current WF_END_DATE
        run: |
          echo "WF_END_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "🗓 WF_END_DATE=$(date -u +%F)（実行日を終端として毎回最新化）"

      - name: Rebuild walk-forward candidates from scratch
        run: |
          rm -f walk_forward_all_candidates.csv
          echo '============================================================'
          echo '🔄 REFRESH WALK-FORWARD CANDIDATES'
          echo '目的: stale/部分生成された候補CSVを使い回さない'
          echo 'ゲート条件・探索閾値・strategy_policyは変更しない'
          echo 'TOP_N=10 / 目標: 毎日取引・毎月収益プラス・収益率優先'
          echo '============================================================'
          python daily_model_retrain.py
          python walk_forward_fast_runner.py
          test -s walk_forward_all_candidates.csv

      - name: Verify candidate coverage and diagnose date gaps
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from pathlib import Path

          p = Path('walk_forward_all_candidates.csv')
          c = pd.read_csv(p)
          if 'date' not in c.columns or 'ticker' not in c.columns:
              raise SystemExit('❌ candidate CSV lacks date/ticker columns')

          c['date'] = pd.to_datetime(c['date'], errors='coerce').dt.normalize()
          c = c.dropna(subset=['date'])
          dates = c['date'].drop_duplicates().sort_values()
          # ★修正(2026-09): 固定リテラルではなく、直前のステップで
          # 当日日付として計算されたWF_END_DATEを使う。
          end = pd.Timestamp(os.environ['WF_END_DATE'])

          print('candidate rows:', len(c))
          print('tickers:', c['ticker'].nunique())
          print('first date:', dates.iloc[0].date() if len(dates) else 'NONE')
          print('last date:', dates.iloc[-1].date() if len(dates) else 'NONE')

          # WF_END_DATEは土曜なので、固定日付そのものではなく、
          # WF_END_DATE以下で実際に存在する最終市場日を基準にする。
          eligible = dates[dates <= end]
          expected_last = eligible.iloc[-1] if len(eligible) else None
          print('expected last trading date <= WF_END_DATE:', expected_last.date() if expected_last is not None else 'NONE')

          if expected_last is None:
              raise SystemExit('❌ no candidate dates at or before WF_END_DATE')

          if dates.iloc[-1] < expected_last:
              raise SystemExit('❌ candidate CSV ends before expected last trading date')

          recent_dates = dates.iloc[-63:]
          daily = c.groupby('date').size().reindex(recent_dates, fill_value=0)
          print('recent 63 trading-day rows:', int(daily.sum()))
          print('recent daily row median:', float(daily.median()))
          print('recent daily row min:', int(daily.min()))
          print('recent daily row max:', int(daily.max()))

          print('--- last 15 candidate dates ---')
          print(daily.tail(15).to_string())

          missing = [d.date().isoformat() for d in recent_dates if daily.loc[d] == 0]
          if missing:
              print('⚠️ zero-candidate dates:', ', '.join(missing))

          # 実行日(WF_END_DATE)から見た候補データの遅延日数を明示する。
          # 固定日付の決め打ちチェックはWF_END_DATEが毎回進むと意味を失うため、
          # 相対的な鮮度チェックに置き換える。
          staleness_days = (end - dates.iloc[-1]).days
          print(f'staleness (WF_END_DATE - last candidate date): {staleness_days} days')
          if staleness_days > 10:
              print(f'⚠️ 候補データがWF_END_DATEから{staleness_days}日遅れています（休場日を考慮しても要確認）')

          if c['ticker'].nunique() < 50:
              raise SystemExit('❌ candidate universe unexpectedly small (<50 tickers)')
          PY

      - name: Run explicit Fold-4 OOS density diagnostic
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          p = Path('walk_forward_all_candidates.csv')
          c = pd.read_csv(p)
          c['date'] = pd.to_datetime(c['date'], errors='coerce').dt.normalize()
          c = c.dropna(subset=['date'])

          print('============================================================')
          print('🔎 FOLD-4 OOS DENSITY DIAGNOSTIC')
          print('ゲート条件・探索閾値・policyは変更しない')
          print('============================================================')

          # 各候補行の代表的な列が存在する場合、段階別件数を確認する。
          for col in ['up', 'score', 'nikkei', 'direction', 'signal', 'ai_score', 'probability', 'prob_up']:
              if col in c.columns:
                  print(f'column present: {col}')

          # 期間を推定し、最後のOOS相当期間を日付密度で可視化する。
          dates = c['date'].drop_duplicates().sort_values()
          if len(dates) >= 90:
              oos_dates = dates.iloc[-90:]
              oos = c[c['date'].isin(oos_dates)]
              print('OOS diagnostic date range:', oos_dates.iloc[0].date(), '->', oos_dates.iloc[-1].date())
              print('OOS raw candidate rows:', len(oos))
              print('OOS unique tickers:', oos['ticker'].nunique())
              print('OOS daily median:', float(oos.groupby('date').size().median()))
              print('OOS daily min:', int(oos.groupby('date').size().min()))
              print('OOS daily max:', int(oos.groupby('date').size().max()))
          else:
              print('⚠️ fewer than 90 unique candidate dates; no OOS-window estimate')
          PY

      # ★修正(2026-09): walk_forward_all_candidates.csvは毎回全期間(WF_START_DATE
      # 〜当日)から作り直され、履歴を切り詰めない設計のため増え続ける一方で、
      # プレーンCSVのままgit管理するとGitHubのpush時ファイルサイズ上限(100MB)を
      # いつか必ず超えて "pre-receive hook declined" で永久に失敗する
      # (実測: 2026-09-18 run 35407517293で133.47MBとなり実際に拒否された)。
      # gzip圧縮は今も毎回行う(圧縮後のファイルをGitHub Releaseアセットとして
      # アップロードするため)。★変更(2026-09): この.gz自体はもうgit管理対象
      # ではない(下のUpload candidates release asset to GitHub Releaseステップ
      # 参照。読む側の全スクリプトはこの実行内でrm -f直後に作り直された
      # プレーンCSVをそのまま読むため、フォーマット変更は一切不要)。
      - name: Compress candidates CSV for release upload
        run: |
          WF_SKIP=0
          gzip -k -9 -f walk_forward_all_candidates.csv
          ls -la walk_forward_all_candidates.csv walk_forward_all_candidates.csv.gz
          GZ_BYTES=$(stat -c%s walk_forward_all_candidates.csv.gz)
          GZ_MB=$((GZ_BYTES / 1000000))
          echo "walk_forward_all_candidates.csv.gz size: ${GZ_MB} MB"
          # ★追加(2026-09): 段階的な可視化として、80/90/95MBでワークフロー
          # アノテーション(::warning::/::error::)を追加する。実際のfail-safe
          # (97MBのWF_SKIP)は、以前はgit addの抑止だったが、release移行後は
          # release資産の更新抑止(前回資産を維持)に読み替える。この段階警告
          # 自体のしきい値やスキップ挙動は変更しない。
          if [ "$GZ_MB" -ge 95 ]; then
            echo "::error::walk_forward_all_candidates.csv.gz size ${GZ_MB}MB >= 95MB (GitHub push limit 100MB) - approaching hard skip threshold (97MB)"
          elif [ "$GZ_MB" -ge 90 ]; then
            echo "::warning::walk_forward_all_candidates.csv.gz size ${GZ_MB}MB >= 90MB (GitHub push limit 100MB)"
          elif [ "$GZ_MB" -ge 80 ]; then
            echo "::warning::walk_forward_all_candidates.csv.gz size ${GZ_MB}MB >= 80MB (GitHub push limit 100MB)"
          fi
          if [ "$GZ_BYTES" -ge 97000000 ]; then
            echo "❌ walk_forward_all_candidates.csv.gzが97MBを超えました。GitHubのpush上限" \
                 "(100MB)に抵触する恐れがあるため、今回のgit addはスキップし、直前に" \
                 "コミット済みの内容を維持します(要調査)。"
            WF_SKIP=1
          elif [ "$GZ_BYTES" -ge 90000000 ]; then
            echo "⚠️ 圧縮後も90MBに接近/超過しています。GitHubのpush上限(100MB)に" \
                 "将来再度抵触する可能性があるため、履歴保持方針の見直しを検討してください。"
          fi
          echo "WF_SKIP=${WF_SKIP}" >> "$GITHUB_ENV"

      # ★変更(2026-09): walk_forward_all_candidates.csv.gzは毎週の全期間再生成の
      # たびにgitへ~63MBの非圧縮性バイナリdiffを積み増し、リポジトリサイズを
      # 際限なく肥大化させていた。git管理をやめ、rolling release
      # (walk-forward-candidates-latest)のアセットとして配布する。releaseの
      # アセットサイズ上限はgit pushの100MB制限よりずっと大きいため、
      # WF_SKIPの意味はgit addの抑止からrelease更新の抑止に読み替える
      # (=巨大化時は前回のrelease資産をそのまま維持する)。
      - name: Upload candidates release asset to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '============================================================'
          echo '📦 UPLOAD walk_forward_all_candidates.csv.gz TO RELEASE'
          echo '目的: 巨大バイナリのgit管理をやめ、GitHub Releaseアセット'
          echo '(walk-forward-candidates-latest)として配布する'
          echo '============================================================'
          if [ "${WF_SKIP:-0}" = "1" ]; then
            echo '⏭ サイズガードによりrelease資産の更新をスキップします(前回の資産を維持)'
            exit 0
          fi
          gh release create walk-forward-candidates-latest \
            --title 'walk-forward-candidates-latest' \
            --notes 'Machine-updated data asset (not a software release). walk_forward_all_candidates.csv.gz is refreshed automatically by refresh-walk-forward-candidates.yml and overwritten in place via --clobber on every successful run.' \
            --prerelease || true
          gh release upload walk-forward-candidates-latest walk_forward_all_candidates.csv.gz --clobber
          echo '✅ release asset uploaded'

      # ★変更(2026-09): train_data.csvはこのジョブでもdaily_model_retrain.py経由で
      # 副次的に再生成されるが、daily-model-retrain.ymlと同じ理由でgit管理対象から
      # 完全に外し、Actions artifact(30日保持)としてのみ保存する。
      - name: Upload train data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-data-csv-refresh-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: train_data.csv

      - name: Commit refreshed candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # ★修正(2026-09): train_data.csvがmain上でまだプレーンCSVとして
          # 追跡されている間(移行後の最初の数回の実行)は、git rm --cached
          # だけでは作業ツリーにプレーンtrain_data.csvが未追跡ファイルとして
          # 残ってしまい、その後のrebaseがorigin/mainの当該コミット(train_data.csv
          # をまだ追跡している)へチェックアウトしようとした際に
          # 「would be overwritten by checkout」で必ず失敗する
          # (daily-model-retrain.yml等、他ジョブのコミットがこのジョブの実行中に
          # mainへ1つでも積まれると発生。ローカルsimulationで実測・再現済み)。
          # stage_and_commitを関数化し、rebaseが競合で失敗した場合はリトライ毎に
          # 「git reset(mixed)でHEAD/indexだけをorigin/mainへ合わせ、作業ツリーの
          # 生成済み出力(train_data.csv.gz等)は保持したまま再ステージ・再コミットする」
          # 方式に変更する(このジョブの出力は常に全期間からの完全な再生成であり、
          # 過去にコミット済みの内容とマージする意味は無いため、競合時は常に
          # 「このジョブの最新出力」で上書きしてよい)。
          stage_and_commit() {
            git rm --cached --ignore-unmatch walk_forward_all_candidates.csv >/dev/null 2>&1 || true
            # ★変更(2026-09): walk_forward_all_candidates.csv.gzはもはやgit管理
            # 対象ではない(直前のUpload candidates release asset to GitHub
            # Releaseステップでrelease資産としてアップロード済み。アップロードが
            # 失敗した場合はこのステップより前でジョブが失敗し、ここには到達しない
            # ため、git管理を外すのはアップロードが実際に行われた場合のみでよい
            # はずだが、WF_SKIP=1の場合はそのUploadステップ自体がアップロードを
            # スキップする(前回のrelease資産を維持するだけで、今回は何もしない)。
            # そのままここで無条件にgit rm --cachedすると、たまたま最初の移行
            # 直後の実行でWF_SKIP=1が発生した場合にrelease資産もgit管理下の
            # コピーもどちらも存在しない状態になりかねない。WF_SKIP=1の間は
            # Uploadステップと同様にgit管理を外す処理自体もスキップし、既存の
            # git管理下コピー(あれば)をそのまま維持する。
            if [ "${WF_SKIP:-0}" != "1" ]; then
              git rm --cached --ignore-unmatch walk_forward_all_candidates.csv.gz >/dev/null 2>&1 || true
              rm -f walk_forward_all_candidates.csv.gz
            else
              # 移行期にまだgit管理下にある場合、今回作業ツリーで上書きされた
              # (巨大化した)gzをcommit済みの内容へ戻し、直後のgit add -uが
              # それを拾って結局コミットしてしまう(WF_SKIPの意味が無くなる)
              # のを防ぐ。
              git checkout -- walk_forward_all_candidates.csv.gz 2>/dev/null || true
            fi
            # ★変更(2026-09): train_data.csv/.gzはもはやgit管理対象ではない
            # (直前のUpload train data artifactステップでActions artifactとして
            # 保存済み)。古いorigin/mainがまだ追跡している場合に備えてgit rm
            # --cachedし、作業ツリーの生成物もrebase時のcheckout衝突を避けるため
            # 削除する。
            git rm --cached --ignore-unmatch train_data.csv train_data.csv.gz >/dev/null 2>&1 || true
            rm -f train_data.csv train_data.csv.gz
            git add model.pkl 2>/dev/null || true
            git add -u
            if git diff --cached --quiet; then
              echo '変更なし'
              exit 0
            fi
            git commit -m 'refresh: rebuild walk-forward candidates and diagnose OOS density [skip ci]'
          }
          stage_and_commit
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ refreshed candidates pushed'
              exit 0
            fi
            git rebase --abort || true
            git reset origin/main
            stage_and_commit
            sleep $((i * 3))
          done
          echo '❌ push failed'
          exit 1
