name: Refresh Walk-Forward Candidates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-walk-forward-candidates.yml'
  schedule:
    # 毎週土曜 07:00 JST（利益Optimizerの約2時間前）
    - cron: '0 22 * * 5'

permissions:
  contents: write

concurrency:
  group: stock-ai-refresh-candidates
  cancel-in-progress: false

env:
  WF_START_DATE: '2021-01-01'
  WF_END_DATE: '2026-08-22'
  WF_TOP_N: '10'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile daily_model_retrain.py
          python -m py_compile walk_forward.py
          python -m py_compile walk_forward_fast_runner.py

      - name: Rebuild walk-forward candidates from scratch
        run: |
          rm -f walk_forward_all_candidates.csv
          echo '============================================================'
          echo '🔄 REFRESH WALK-FORWARD CANDIDATES'
          echo '目的: stale/部分生成された候補CSVを使い回さない'
          echo 'ゲート条件・探索閾値・strategy_policyは変更しない'
          echo 'TOP_N=10 / 目標: 毎日取引・毎月収益プラス・収益率優先'
          echo '============================================================'
          python daily_model_retrain.py
          python walk_forward_fast_runner.py
          test -s walk_forward_all_candidates.csv

      - name: Verify candidate coverage and recent OOS density
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          p = Path('walk_forward_all_candidates.csv')
          c = pd.read_csv(p)
          c['date'] = pd.to_datetime(c['date'], errors='coerce').dt.normalize()
          c = c.dropna(subset=['date'])
          print('candidate rows:', len(c))
          print('tickers:', c['ticker'].nunique() if 'ticker' in c.columns else 'UNKNOWN')
          print('first date:', c['date'].min().date())
          print('last date:', c['date'].max().date())
          recent_dates = c['date'].drop_duplicates().sort_values().iloc[-63:]
          if len(recent_dates):
              recent = c[c['date'].isin(recent_dates)]
              daily = c.groupby('date').size().reindex(recent_dates, fill_value=0)
              print('recent 63 trading-day rows:', len(recent))
              print('recent daily row median:', daily.median())
              print('recent daily row min:', daily.min())
              print('recent daily row max:', daily.max())
          if c['date'].max() < pd.Timestamp('2026-08-22'):
              raise SystemExit('❌ candidate CSV is not current through WF_END_DATE')
          if 'ticker' not in c.columns or c['ticker'].nunique() < 50:
              raise SystemExit('❌ candidate universe unexpectedly small (<50 tickers)')
          PY

      - name: Commit refreshed candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add walk_forward_all_candidates.csv model.pkl train_data.csv 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m 'refresh: rebuild walk-forward candidates before OOS optimizer [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ refreshed candidates pushed'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ push failed'
          exit 1
