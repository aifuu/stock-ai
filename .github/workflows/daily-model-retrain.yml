name: Daily Model Retrain

on:
  schedule:
    # JST 07:30（UTC 22:30、月〜金）
    # UTC 22:30+9h=JST翌日07:30のため、UTC曜日は月〜金(1-5)ではなく日〜木(0-4)を
    # 指定する必要がある。1-5のままだとJST火〜土に発火し、月曜(UTC日曜が対象)は
    # 発火せず、土曜(UTC金曜が対象)に不要発火する。ai-stock-scan.ymlの
    # '30 23 * * 0-4'と同じ既知の修正パターン(2026-08判明・修正済み)。
    - cron: '30 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

# Research/retraining must not block the independent paper-trading workflow.
concurrency:
  group: stock-ai-research-VERIFY-DRYRUN
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile daily_directional_top1.py
          python -m py_compile daily_model_retrain.py
          python -m py_compile trade_feedback_engine.py

      - name: Analyze paper-trade feedback
        env:
          RETRAIN_HOLDOUT_DAYS: '90'
          FEEDBACK_LOOKBACK_DAYS: '180'
          FEEDBACK_MIN_GROUP_TRADES: '12'
        run: python trade_feedback_engine.py

      - name: Run daily model retraining
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RETRAIN_HOLDOUT_DAYS: '90'
          RETRAIN_MIN_OOS_TRADES: '15'
          RETRAIN_MIN_OOS_PF: '1.0'
          RETRAIN_MAX_OOS_DD_PCT: '30.0'
          RETRAIN_MIN_ROWS: '3000'
          RETRAIN_DOWNLOAD_SLEEP: '0.15'
        run: python daily_model_retrain.py

      - name: Verify retrain outputs
        run: |
          test -s train_data.csv
          test -s daily_retrain_report.csv
          test -s trade_feedback_policy.json
          test -f trade_feedback_report.csv
          python - <<'PY'
          import json
          import os
          import joblib
          import pandas as pd
          train = pd.read_csv('train_data.csv')
          report = pd.read_csv('daily_retrain_report.csv')
          with open('trade_feedback_policy.json', encoding='utf-8') as f:
              policy = json.load(f)
          if not isinstance(policy, dict):
              raise ValueError('trade_feedback_policy.json must contain a JSON object')
          required_keys = {'version', 'generated_at', 'source', 'direction_weights'}
          missing = required_keys - policy.keys()
          if missing:
              raise ValueError(f'trade_feedback_policy.json missing keys: {sorted(missing)}')
          print(f'✅ 学習データ: {len(train):,}行')
          print(f'✅ 再学習レポート: {len(report):,}行')
          print('✅ feedback policy生成済み')
          # ★修正(2026-09): daily_model_retrain.pyが実際に書き込むのは
          # trader.MODEL_FILE = "directional_model.pkl"であり、"model.pkl"は
          # 無関係な別システム(stock_scan.py)専用のファイル名。旧チェックは
          # 常にFalseで、OOSゲート通過モデルの検証も検知もできていなかった。
          if os.path.exists('directional_model.pkl'):
              model = joblib.load('directional_model.pkl')
              print(f'✅ directional_model.pkl classes: {getattr(model, "classes_", "unknown")}')
          else:
              print('🟡 directional_model.pklは今回差し替えなし')
          PY

      - name: Remove temporary previous model backup
        if: always()
        run: |
          rm -f model_prev.pkl
          echo '✅ 一時退避model_prev.pklを削除（Git/Artifactには残さない）'

      # ★追加(2026-09): train_data.csvはプレーンCSVのままgit管理すると
      # walk_forward_all_candidates.csv(修正: b292b03)と同じ構造的リスク
      # (GitHubのpush時ファイルサイズ上限100MBにいつか抵触)を抱えるため、
      # gzip圧縮した.gzのみをgit管理対象にする。read側(stock_scan.py)は
      # train_data.csv.gzへのフォールバックに対応済みで、このジョブ内では
      # 直前のステップが書いたプレーンtrain_data.csvをそのまま圧縮するだけ
      # (train_data.csv自体の生成ロジック・列は一切変更しない)。
      # 圧縮後も上限に接近/超過する場合は、pushを失敗させる代わりに
      # git addをスキップして前回コミット済みの内容を維持する(このジョブの
      # 主目的はOOSゲート付きモデル再学習であり、train_data.csvの更新が
      # それを止めてはならないため)。
      - name: Compress train data for git storage
        if: always()
        run: |
          TRAIN_DATA_SKIP=0
          if [ -s train_data.csv ]; then
            gzip -k -9 -f train_data.csv
            ls -la train_data.csv train_data.csv.gz
            TD_GZ_BYTES=$(stat -c%s train_data.csv.gz)
            TD_GZ_MB=$((TD_GZ_BYTES / 1000000))
            echo "train_data.csv.gz size: ${TD_GZ_MB} MB"
            if [ "$TD_GZ_BYTES" -ge 97000000 ]; then
              echo "❌ train_data.csv.gzが97MBを超えました。GitHubのpush上限(100MB)に" \
                   "抵触する恐れがあるため、今回のtrain_data.csv.gz更新はスキップし、" \
                   "直前にコミット済みの内容を維持します(要調査)。"
              TRAIN_DATA_SKIP=1
            elif [ "$TD_GZ_BYTES" -ge 90000000 ]; then
              echo "⚠️ train_data.csv.gzが90MBに接近しています。GitHubのpush上限(100MB)に" \
                   "将来再度抵触する可能性があるため、保持方針の見直しを検討してください。"
            fi
          else
            echo 'ℹ️ train_data.csvが無い/空のため圧縮をスキップします'
          fi
          echo "TRAIN_DATA_SKIP=${TRAIN_DATA_SKIP}" >> "$GITHUB_ENV"

      - name: Commit retraining and feedback artifacts safely
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # ★修正(2026-09): 実際にOOSゲートを通過したモデルは
          # directional_model.pkl(daily_directional_top1.py / profit_top10_paper.py
          # が読む本番ファイル)。旧"model.pkl"は無関係な別ファイル名で、
          # 生成された検証済みモデルが一度もコミットされずランナー終了と共に
          # 消滅していた。
          # ★変更(2026-09): 上記の事故(2026-09-03)は当時のファイル名不一致バグが
          # 原因でgit add自体が実質的に空振りしていた。同種の再発(git add失敗の
          # 黙殺・将来のtypo等)を検知できるよう、add前に「新規/更新されたdirectional_
          # model.pklが作業ツリーにあるか」を記録しておき、あった場合はadd後に必ず
          # stageされていることを確認する(deploy=Falseで既存モデル無変更の通常ケース
          # では何もチェックしない、誤検知防止)。
          PKL_CHANGED_BEFORE_ADD=$(git status --porcelain -- directional_model.pkl)
          git add directional_model.pkl 2>/dev/null || true
          git rm --cached --ignore-unmatch train_data.csv >/dev/null 2>&1 || true
          if [ "${TRAIN_DATA_SKIP:-0}" = "1" ]; then
            echo '⏭ train_data.csv.gzのサイズガードによりgit addをスキップします'
          else
            git add train_data.csv.gz 2>/dev/null || true
          fi
          git add daily_retrain_report.csv 2>/dev/null || true
          git add trade_feedback_policy.json 2>/dev/null || true
          git add trade_feedback_report.csv 2>/dev/null || true
          git add -u
          if [ -n "$PKL_CHANGED_BEFORE_ADD" ] && ! git diff --cached --name-only | grep -qx 'directional_model.pkl'; then
            echo '❌ directional_model.pklが新規/更新されているのにgit stageに含まれていません(git add失敗の可能性、要調査)'
            exit 1
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'chore: daily model retrain and feedback [skip ci]'
          echo '🧪 VERIFY-DRYRUN: mainへのpushは行いません。ローカルcommitの内容のみ確認します。'
          git show --stat HEAD
          echo '--- diff origin/main vs HEAD (この検証runのcommitのみが差分であることを確認) ---'
          git fetch origin main
          git diff --stat origin/main HEAD

      - name: Upload retrain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-model-retrain-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            directional_model.pkl
            train_data.csv
            daily_retrain_report.csv
            trade_feedback_policy.json
            trade_feedback_report.csv
