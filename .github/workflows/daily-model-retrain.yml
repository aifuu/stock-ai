name: Daily Model Retrain

on:
  schedule:
    # JST 07:30（UTC 22:30、月〜金）
    # UTC 22:30+9h=JST翌日07:30のため、UTC曜日は月〜金(1-5)ではなく日〜木(0-4)を
    # 指定する必要がある。1-5のままだとJST火〜土に発火し、月曜(UTC日曜が対象)は
    # 発火せず、土曜(UTC金曜が対象)に不要発火する。ai-stock-scan.ymlの
    # '30 23 * * 0-4'と同じ既知の修正パターン(2026-08判明・修正済み)。
    - cron: '30 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

# Research/retraining must not block the independent paper-trading workflow.
concurrency:
  group: stock-ai-research
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile daily_directional_top1.py
          python -m py_compile daily_model_retrain.py
          python -m py_compile trade_feedback_engine.py

      # ★決定(ライブセッション中の二重実行・モデル差し替え禁止、2026-09-29の
      # インシデントを受けて): クラウド側ルーチンがJST 07:15にworkflow_dispatch
      # する運用に一本化したが、このワークフロー自身のschedule('30 22 * * 0-4' =
      # JST 07:30予定)も実運用遅延(実測1.5〜2.5時間程度)でJST 09:20〜10:00頃に
      # 発火することがあり、ai-stock-scan.ymlのAMセッション(09:20〜12:35 JST、
      # 5分ループでpullしながら売買判定)と重なってdirectional_model.pklを
      # 差し替えてしまうと、ライブのペーパートレードセッション中にモデルが
      # 入れ替わる事故になる。ジョブの最も早い段階(依存インストール直後)で、
      # daily_model_retrain.pyのretrain_window_open()/already_retrained_today()
      # (単体テストで境界値まで検証済み)と全く同じ判定関数をそのまま呼び、
      # 以下いずれかならこの後の重い処理(feedback分析・再学習・出力検証)を
      # すべてスキップする: (i) JST 08:40〜15:34(ライブセッション想定時間帯)、
      # (ii) daily_retrain_report.csvに本日分の行が既にある(＝先に完走した
      # 実行が既にある)。判定自体が失敗した場合はproceed出力が設定されず、
      # 後続の `if: steps.retrain_gate.outputs.proceed == 'true'` は空文字列
      # (≠'true')として安全側(スキップ)に倒れる。
      - name: Check retrain window & same-day guard
        id: retrain_gate
        run: |
          DECISION=$(python - <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import daily_model_retrain as m

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          today = now.strftime("%Y-%m-%d")
          if not m.retrain_window_open(now):
              print(
                  f"⏳ 実行時刻 {now:%H:%M} JSTはライブセッション想定時間帯"
                  "(08:40〜15:34 JST)のため再学習ジョブ全体をスキップします",
                  file=sys.stderr,
              )
              print("false")
          elif m.already_retrained_today(today):
              print(f"⏭ 本日({today})分の再学習は既に完了済みのためスキップします", file=sys.stderr)
              print("false")
          else:
              print(f"▶ 再学習実行可({now:%H:%M} JST、本日分は未実施)", file=sys.stderr)
              print("true")
          PY
          )
          echo "proceed=$DECISION" >> "$GITHUB_OUTPUT"

      - name: Analyze paper-trade feedback
        if: steps.retrain_gate.outputs.proceed == 'true'
        env:
          RETRAIN_HOLDOUT_DAYS: '90'
          FEEDBACK_LOOKBACK_DAYS: '180'
          FEEDBACK_MIN_GROUP_TRADES: '12'
        run: python trade_feedback_engine.py

      - name: Run daily model retraining
        if: steps.retrain_gate.outputs.proceed == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RETRAIN_HOLDOUT_DAYS: '90'
          RETRAIN_MIN_OOS_TRADES: '15'
          RETRAIN_MIN_OOS_PF: '1.0'
          RETRAIN_MAX_OOS_DD_PCT: '30.0'
          RETRAIN_MIN_ROWS: '3000'
          RETRAIN_DOWNLOAD_SLEEP: '0.15'
        run: python daily_model_retrain.py

      - name: Verify retrain outputs
        if: steps.retrain_gate.outputs.proceed == 'true'
        run: |
          test -s train_data.csv
          test -s daily_retrain_report.csv
          test -s trade_feedback_policy.json
          test -f trade_feedback_report.csv
          python - <<'PY'
          import json
          import os
          import joblib
          import pandas as pd
          train = pd.read_csv('train_data.csv')
          report = pd.read_csv('daily_retrain_report.csv')
          with open('trade_feedback_policy.json', encoding='utf-8') as f:
              policy = json.load(f)
          if not isinstance(policy, dict):
              raise ValueError('trade_feedback_policy.json must contain a JSON object')
          required_keys = {'version', 'generated_at', 'source', 'direction_weights'}
          missing = required_keys - policy.keys()
          if missing:
              raise ValueError(f'trade_feedback_policy.json missing keys: {sorted(missing)}')
          print(f'✅ 学習データ: {len(train):,}行')
          print(f'✅ 再学習レポート: {len(report):,}行')
          print('✅ feedback policy生成済み')
          # ★修正(2026-09): daily_model_retrain.pyが実際に書き込むのは
          # trader.MODEL_FILE = "directional_model.pkl"であり、"model.pkl"は
          # 無関係な別システム(stock_scan.py)専用のファイル名。旧チェックは
          # 常にFalseで、OOSゲート通過モデルの検証も検知もできていなかった。
          if os.path.exists('directional_model.pkl'):
              model = joblib.load('directional_model.pkl')
              print(f'✅ directional_model.pkl classes: {getattr(model, "classes_", "unknown")}')
          else:
              print('🟡 directional_model.pklは今回差し替えなし')
          PY

      - name: Remove temporary previous model backup
        if: always()
        run: |
          rm -f model_prev.pkl
          echo '✅ 一時退避model_prev.pklを削除（Git/Artifactには残さない）'

      # ★変更(2026-09): train_data.csvはこのジョブの中で毎回全期間から完全に
      # 再生成される中間データであり、gitで履歴管理する必要が無い
      # (gzip圧縮してgit管理していたverify/train-data-csv-gz時点の設計は、
      # 圧縮後もpush毎に新規blobとしてリポジトリに積み増され続け、GitHubの
      # リポジトリサイズを圧迫し続ける問題を解決できていなかった)。
      # git管理を完全にやめ、直後のUpload train data artifactステップで
      # Actions artifact(30日保持)としてのみ保存する。読む側で唯一
      # train_data.csv/.gzを参照するstock_scan.pyは、このワークフローからは
      # 呼び出されておらず(py_compileのみ)、フレッシュチェックアウトで
      # ファイルが存在しない場合は元々None,Noneを返す設計のため影響しない。
      # アーティファクトのアップロードはgit tracking除去・削除より前に
      # 行う必要があるため、コミットステップより前に配置する。
      - name: Upload train data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-data-csv-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: train_data.csv

      - name: Remove temporary train_data.csv from git tracking
        if: always()
        run: |
          git rm --cached --ignore-unmatch train_data.csv train_data.csv.gz >/dev/null 2>&1 || true

      - name: Commit retraining and feedback artifacts safely
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # ★修正(2026-09): train_data.csvがmain上でまだ(プレーンCSV or .gzとして)
          # 追跡されている間(この移行の最初の数回の実行)は、git rm --cached
          # だけでは作業ツリーに生成物が未追跡ファイルとして残ってしまい、
          # その後のrebaseがorigin/mainの当該コミット(train_data.csv[.gz]を
          # まだ追跡している)へチェックアウトしようとした際に
          # 「would be overwritten by checkout」で必ず失敗する
          # (このジョブの実行中に他のコミットがmainへ1つでも積まれると発生。
          # ローカルsimulationで実測・再現済み)。stage_and_commitを関数化し、
          # rebaseが競合で失敗した場合はリトライ毎に「git reset(mixed)で
          # HEAD/indexだけをorigin/mainへ合わせ、作業ツリーの生成済み出力は
          # 保持したまま再ステージ・再コミットする」方式に変更する
          # (このジョブの出力は常に全期間からの完全な再生成であり、
          # 過去にコミット済みの内容とマージする意味は無いため、
          # 競合時は常に「このジョブの最新出力」で上書きしてよい)。
          stage_and_commit() {
            # ★修正(2026-09): 実際にOOSゲートを通過したモデルは
            # directional_model.pkl(daily_directional_top1.py / profit_top10_paper.py
            # が読む本番ファイル)。旧"model.pkl"は無関係な別ファイル名で、
            # 生成された検証済みモデルが一度もコミットされずランナー終了と共に
            # 消滅していた。
            # ★変更(2026-09): 上記の事故(2026-09-03)は当時のファイル名不一致バグが
            # 原因でgit add自体が実質的に空振りしていた。同種の再発(git add失敗の
            # 黙殺・将来のtypo等)を検知できるよう、add前に「新規/更新されたdirectional_
            # model.pklが作業ツリーにあるか」を記録しておき、あった場合はadd後に必ず
            # stageされていることを確認する(deploy=Falseで既存モデル無変更の通常ケース
            # では何もチェックしない、誤検知防止)。
            PKL_CHANGED_BEFORE_ADD=$(git status --porcelain -- directional_model.pkl)
            git add directional_model.pkl 2>/dev/null || true
            # ★追加(③モデル記録サイドカー): directional_model_meta.jsonは常に
            # directional_model.pklと対になって書かれるが、片方のgit add失敗が
            # もう片方に波及しないよう(既知の落とし穴)、別のgit add行に分ける。
            git add directional_model_meta.json 2>/dev/null || true
            # ★変更(2026-09): train_data.csvはもはやgit管理対象ではない
            # (Upload retrain artifactsステップでActions artifactとしてのみ保存)。
            # 古いorigin/mainがまだ追跡している場合に備えてgit rm --cachedし、
            # 作業ツリーの生成物もrebase時のcheckout衝突を避けるため削除する。
            git rm --cached --ignore-unmatch train_data.csv train_data.csv.gz >/dev/null 2>&1 || true
            rm -f train_data.csv train_data.csv.gz
            git add daily_retrain_report.csv 2>/dev/null || true
            git add trade_feedback_policy.json 2>/dev/null || true
            git add trade_feedback_report.csv 2>/dev/null || true
            git add -u
            if [ -n "$PKL_CHANGED_BEFORE_ADD" ] && ! git diff --cached --name-only | grep -qx 'directional_model.pkl'; then
              echo '❌ directional_model.pklが新規/更新されているのにgit stageに含まれていません(git add失敗の可能性、要調査)'
              exit 1
            fi
            git diff --cached --quiet && exit 0
            git commit -m 'chore: daily model retrain and feedback [skip ci]'
          }
          stage_and_commit
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ daily model retrain/feedback push成功'
              exit 0
            fi
            git rebase --abort || true
            git reset origin/main
            stage_and_commit
            sleep $((i * 3))
          done
          echo '❌ daily model retrain/feedback push失敗'
          exit 1

      - name: Upload retrain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-model-retrain-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            directional_model.pkl
            directional_model_meta.json
            daily_retrain_report.csv
            trade_feedback_policy.json
            trade_feedback_report.csv
