name: Daily Model Retrain 
 
on: 
  schedule: 
    # JST 07:30（UTC 22:30、月〜金） 
    - cron: '30 22 * * 1-5' 
  workflow_dispatch: {} 
 
permissions: 
  contents: write 
 
# Research/retraining must not block the independent paper-trading workflow. 
concurrency: 
  group: stock-ai-research 
  cancel-in-progress: false 
 
jobs: 
  retrain: 
    runs-on: ubuntu-latest 
    timeout-minutes: 35 
    steps: 
      - name: Checkout latest main 
        uses: actions/checkout@v4 
        with: 
          ref: main 
          fetch-depth: 0 
 
      - name: Setup Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.11' 
 
      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip 
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday 
 
      - name: Syntax check 
        run: | 
          python -m py_compile daily_directional_top1.py 
          python -m py_compile daily_model_retrain.py 
          python -m py_compile trade_feedback_engine.py 
 
      - name: Analyze paper-trade feedback 
        env: 
          RETRAIN_HOLDOUT_DAYS: '90' 
          FEEDBACK_LOOKBACK_DAYS: '180' 
          FEEDBACK_MIN_GROUP_TRADES: '12' 
        run: python trade_feedback_engine.py 
 
      - name: Run daily model retraining 
        env: 
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} 
          RETRAIN_HOLDOUT_DAYS: '90' 
          RETRAIN_MIN_OOS_TRADES: '15' 
          RETRAIN_MIN_OOS_PF: '1.0' 
          RETRAIN_MAX_OOS_DD_PCT: '30.0' 
          RETRAIN_MIN_ROWS: '3000' 
          RETRAIN_DOWNLOAD_SLEEP: '0.15' 
        run: python daily_model_retrain.py 
 
      - name: Verify retrain outputs 
        run: | 
          test -s train_data.csv 
          test -s daily_retrain_report.csv 
          test -s trade_feedback_policy.json 
          test -f trade_feedback_report.csv 
          python - <<'PY' 
          import json 
          import os 
          import joblib 
          import pandas as pd 
          train = pd.read_csv('train_data.csv') 
          report = pd.read_csv('daily_retrain_report.csv') 
          with open('trade_feedback_policy.json', encoding='utf-8') as f: 
              policy = json.load(f) 
          if not isinstance(policy, dict): 
              raise ValueError('trade_feedback_policy.json must contain a JSON object') 
          required_keys = {'version', 'generated_at', 'source', 'direction_weights'} 
          missing = required_keys - policy.keys() 
          if missing: 
              raise ValueError(f'trade_feedback_policy.json missing keys: {sorted(missing)}') 
          print(f'✅ 学習データ: {len(train):,}行') 
          print(f'✅ 再学習レポート: {len(report):,}行') 
          print('✅ feedback policy生成済み') 
          # ★修正(2026-09): daily_model_retrain.pyが実際に書き込むのは 
          # trader.MODEL_FILE = "directional_model.pkl"であり、"model.pkl"は 
          # 無関係な別システム(stock_scan.py)専用のファイル名。旧チェックは 
          # 常にFalseで、OOSゲート通過モデルの検証も検知もできていなかった。 
          if os.path.exists('directional_model.pkl'): 
              model = joblib.load('directional_model.pkl') 
              print(f'✅ directional_model.pkl classes: {getattr(model, "classes_", "unknown")}') 
          else: 
              print('🟡 directional_model.pklは今回差し替えなし') 
          PY 
 
      - name: Remove temporary previous model backup 
        if: always() 
        run: | 
          rm -f model_prev.pkl 
          echo '✅ 一時退避model_prev.pklを削除（Git/Artifactには残さない）' 
 
      - name: Commit retraining and feedback artifacts safely 
        if: always() 
        run: | 
          set -e 
          git config user.name 'github-actions[bot]' 
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' 
          # ★修正(2026-09): 実際にOOSゲートを通過したモデルは 
          # directional_model.pkl(daily_directional_top1.py / profit_top10_paper.py 
          # が読む本番ファイル)。旧"model.pkl"は無関係な別ファイル名で、 
          # 生成された検証済みモデルが一度もコミットされずランナー終了と共に 
          # 消滅していた。 
          git add directional_model.pkl 2>/dev/null || true 
          git add train_data.csv 2>/dev/null || true 
          git add daily_retrain_report.csv 2>/dev/null || true 
          git add trade_feedback_policy.json 2>/dev/null || true 
          git add trade_feedback_report.csv 2>/dev/null || true 
          git add -u 
          git diff --cached --quiet && exit 0 
          git commit -m 'chore: daily model retrain and feedback [skip ci]' 
          for i in 1 2 3 4 5; do 
            git fetch origin main 
            if git rebase --autostash origin/main && git push origin HEAD:main; then 
              echo '✅ daily model retrain/feedback push成功' 
              exit 0 
            fi 
            git rebase --abort || true 
            sleep $((i * 3)) 
          done 
          echo '❌ daily model retrain/feedback push失敗' 
          exit 1 
 
      - name: Upload retrain artifacts 
        uses: actions/upload-artifact@v4 
        with: 
          name: daily-model-retrain-${{ github.run_id }} 
          if-no-files-found: warn 
          path: | 
            directional_model.pkl 
            train_data.csv 
            daily_retrain_report.csv 
            trade_feedback_policy.json 
            trade_feedback_report.csv