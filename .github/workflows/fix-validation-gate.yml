name: Fix validation gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Connect corrected bootstrap gate to validation PASS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('adversarial_strategy_validator.py')
          s = p.read_text(encoding='utf-8')
          old = '& (validation_summary.validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)\n    )'
          new = '& (validation_summary.validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)\n        & (validation_summary.validation_avg_lower > 0)\n    )'
          if old in s:
              s = s.replace(old, new, 1)
          elif '& (validation_summary.validation_avg_lower > 0)' not in s:
              raise SystemExit('validation PASS gate pattern not found')
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile adversarial_strategy_validator.py build_strategy_policy.py risk_manager.py adversarial_pretty_runner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adversarial_strategy_validator.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: enforce corrected validation bootstrap gate"
          git push origin main
