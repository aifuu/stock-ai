name: Repair adversarial gates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safety and validation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # 1) Monte Carlo must be fail-closed in policy builder.
          p = root / 'build_strategy_policy.py'
          s = p.read_text(encoding='utf-8')
          old = '''mc_columns_exist = all(col in df.columns for col in mc_columns)\nif not mc_columns_exist:\n    print("⚠ Monte Carlo列がありません")\n    print("Monte Carlo条件なしでは自動採用しません")'''
          new = '''mc_columns_exist = all(col in df.columns for col in mc_columns)\nif not mc_columns_exist:\n    keep_existing_policy(\n        "Monte Carlo列がありません。破産確率/P90 DD/到達確率を検証できないため自動採用を停止"\n    )'''
          if old not in s:
              raise SystemExit('build_strategy_policy.py: MC block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Risk default: simultaneous positions = 3.
          p = root / 'risk_manager.py'
          s = p.read_text(encoding='utf-8')
          old = 'MAX_POSITIONS = int(os.getenv("AI_MAX_POSITIONS", "20"))'
          if old not in s:
              raise SystemExit('risk_manager.py: MAX_POSITIONS line not found')
          p.write_text(s.replace(old, 'MAX_POSITIONS = int(os.getenv("AI_MAX_POSITIONS", "3"))', 1), encoding='utf-8')

          # 3) Bootstrap policy is not an approval.
          p = root / 'strategy_policy.json'
          policy = json.loads(p.read_text(encoding='utf-8'))
          if policy.get('source') == 'bootstrap_default' and policy.get('strategy_name') == 'BOOTSTRAP_DEFAULT_PENDING_OPTIMIZER':
              policy['status'] = 'PENDING'
          p.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 4) Pretty runner: align with current validator output.
          p = root / 'adversarial_pretty_runner.py'
          s = p.read_text(encoding='utf-8')
          if '("🛡️ ADVERSARIAL STRATEGY VALIDATOR", "🛡️ AI戦略｜敵対的検証レポート"),' in s:
              s = s.replace(
                  '("🛡️ ADVERSARIAL STRATEGY VALIDATOR", "🛡️ AI戦略｜敵対的検証レポート"),',
                  '("🛡️ AI PROFIT OPTIMIZER", "🛡️ AI戦略｜敵対的利益最適化レポート"),',
                  1,
              )
          s = s.replace('("N_eff近似:", "実質的な独立戦略数："),',
                        '("N_eff:", "実質的な独立戦略数："),', 1)
          p.write_text(s, encoding='utf-8')

          # 5) Adversarial validator: connect purge/embargo, multiple-test correction,
          #    and mandatory Monte Carlo outputs used by build_strategy_policy.py.
          p = root / 'adversarial_strategy_validator.py'
          s = p.read_text(encoding='utf-8')

          old_split = '''oos_dates = all_dates[-OOS_DAYS:]\npre_oos = all_dates[:-OOS_DAYS]\nsplit = int(len(pre_oos) * 0.60)\ndev_dates = pre_oos[:split]\nvalidation_dates = pre_oos[split:]\nphase_map = {d: "DEV" for d in dev_dates}\nphase_map.update({d: "VALIDATION" for d in validation_dates})\nphase_map.update({d: "OOS" for d in oos_dates})\ncandidates["phase"] = candidates["date"].map(phase_map)'''
          new_split = '''oos_dates = all_dates[-OOS_DAYS:]\npre_oos = all_dates[:-OOS_DAYS]\nsplit = int(len(pre_oos) * 0.60)\nraw_dev_dates = pre_oos[:split]\nraw_validation_dates = pre_oos[split:]\n\n# Purge/Embargo: phase boundaries are separated by explicit business-day gaps.\n# Purge removes signals whose future holding window can cross a phase boundary;\n# embargo removes the first days of the next phase from selection.\npurge_n = max(0, min(PURGE_DAYS, len(raw_dev_dates) - 1))\nembargo_n = max(0, min(EMBARGO_DAYS, len(raw_validation_dates) - 1))\ndev_dates = raw_dev_dates[:-purge_n] if purge_n else raw_dev_dates\nvalidation_start = embargo_n\nvalidation_dates = raw_validation_dates[validation_start:]\nif not dev_dates or not validation_dates:\n    raise RuntimeError("Purge/Embargo後にDEVまたはValidation期間が空になりました。期間設定を確認してください。")\nphase_map = {d: "DEV" for d in dev_dates}\nphase_map.update({d: "VALIDATION" for d in validation_dates})\nphase_map.update({d: "OOS" for d in oos_dates})\ncandidates["phase"] = candidates["date"].map(phase_map)\n\n# Effective number of independent strategies: conservative N_eff proxy for\n# multiple-testing adjustment across the full parameter sweep.\nN_EFFECTIVE_STRATEGIES = max(1, int(np.ceil(np.sqrt(\n    len(UP_THRESHOLDS) * len(SCORE_THRESHOLDS) * len(NIKKEI_FILTERS)\n    * len(TP_MULTIPLIERS) * len(SL_MULTIPLIERS) * len(HOLD_DAYS_LIST)\n))))\nMULTIPLE_TEST_ALPHA = 0.05 / N_EFFECTIVE_STRATEGIES'''
          if old_split not in s:
              raise SystemExit('adversarial_strategy_validator.py: phase split block not found')
          s = s.replace(old_split, new_split, 1)

          old_row = '''                "return": ret,\n                "hold_days": days,\n                "phase": r["phase"],\n            })'''
          new_row = '''                "return": ret,\n                "hold_days": days,\n                "phase": r["phase"],\n                # R-multiple denominator used for risk-based Monte Carlo sizing.\n                "risk_unit": max(1e-8, float(atr_ratio) / 100.0 * float(sl)),\n            })'''
          if old_row not in s:
              raise SystemExit('adversarial_strategy_validator.py: trade row block not found')
          s = s.replace(old_row, new_row, 1)

          old_boot = '''def block_bootstrap_lower(values, block_len=10, n_iter=BOOTSTRAP_ITERATIONS):\n    values = np.asarray(values, dtype=float)\n    if len(values) < 10:\n        return np.nan\n    rng = np.random.default_rng(RANDOM_SEED)\n    n = len(values)\n    starts = np.arange(max(1, n - block_len + 1))\n    out = []\n    for _ in range(n_iter):\n        sample = []\n        while len(sample) < n:\n            s = int(rng.choice(starts))\n            sample.extend(values[s:s + block_len])\n        out.append(float(np.mean(sample[:n])))\n    return float(np.quantile(out, 0.05))'''
          new_boot = '''def block_bootstrap_lower(values, block_len=10, n_iter=BOOTSTRAP_ITERATIONS, alpha=0.05):\n    values = np.asarray(values, dtype=float)\n    values = values[np.isfinite(values)]\n    if len(values) < 10:\n        return np.nan\n    rng = np.random.default_rng(RANDOM_SEED)\n    n = len(values)\n    starts = np.arange(max(1, n - block_len + 1))\n    out = []\n    for _ in range(n_iter):\n        sample = []\n        while len(sample) < n:\n            start = int(rng.choice(starts))\n            sample.extend(values[start:start + block_len])\n        out.append(float(np.mean(sample[:n])))\n    return float(np.quantile(out, max(1e-6, min(0.5, alpha))))\n\n\ndef monte_carlo_risk_gate(trades, initial_capital=INITIAL_CAPITAL, target_capital=100000000.0,\n                          years_list=(10, 15, 20), iterations=None):\n    """Risk-based Monte Carlo gate.\n\n    Trade returns are converted to R-multiples using the ATR/SL risk unit, then\n    simulated with fixed fractional risk sizing. The selected sizing is the\n    largest tested size with bankruptcy probability <5% and P90 max DD <=30%.\n    """\n    iterations = int(iterations or int(os.getenv("WF_MONTE_CARLO_ITERATIONS", "5000")))\n    if trades is None or trades.empty or "return" not in trades or "risk_unit" not in trades:\n        return None\n    x = trades.copy()\n    ret = pd.to_numeric(x["return"], errors="coerce").to_numpy(dtype=float)\n    risk_unit = pd.to_numeric(x["risk_unit"], errors="coerce").to_numpy(dtype=float)\n    mask = np.isfinite(ret) & np.isfinite(risk_unit) & (risk_unit > 0)\n    r_mult = (ret[mask] / 100.0) / risk_unit[mask]\n    r_mult = r_mult[np.isfinite(r_mult)]\n    if len(r_mult) < 20:\n        return None\n\n    annual_signals = max(1.0, len(r_mult) / max(0.5, (trades["date"].max() - trades["date"].min()).days / 365.25))\n    rng = np.random.default_rng(RANDOM_SEED)\n    best = None\n    sizing_grid = [0.0025, 0.005, 0.0075, 0.01]\n\n    # Evaluate highest sizing first so the first passing size is the chosen one.\n    for sizing in sizing_grid[::-1]:\n        checkpoints = {}\n        worst_dd_20 = None\n        ruined_20 = None\n        path = np.full(iterations, float(initial_capital))\n        peak = path.copy()\n        max_dd = np.zeros(iterations, dtype=float)\n        for year in range(1, 21):\n            n_trades = max(1, int(round(annual_signals)))\n            sampled = rng.choice(r_mult, size=(iterations, n_trades), replace=True)\n            # Fixed-fractional sizing: each trade risks `sizing` of current capital.\n            growth = np.prod(np.clip(1.0 + sizing * sampled, 0.01, 5.0), axis=1)\n            path *= growth\n            peak = np.maximum(peak, path)\n            max_dd = np.minimum(max_dd, path / np.maximum(peak, 1e-9) - 1.0)\n            if year in years_list:\n                checkpoints[year] = float(np.mean(path >= target_capital) * 100.0)\n            if year == 20:\n                worst_dd_20 = float(np.quantile(-max_dd, 0.90) * 100.0)\n                ruined_20 = float(np.mean(path <= initial_capital * 0.50) * 100.0)\n\n        if ruined_20 is not None and worst_dd_20 is not None and ruined_20 < 5.0 and worst_dd_20 <= 30.0:\n            best = {\n                "sizing": sizing,\n                "prob_10y": checkpoints.get(10, 0.0),\n                "prob_15y": checkpoints.get(15, 0.0),\n                "prob_20y": checkpoints.get(20, 0.0),\n                "bankruptcy_prob": ruined_20,\n                "p90_max_dd": worst_dd_20,\n            }\n            break\n\n    if best is None:\n        # Return the safest tested sizing as a diagnostic; policy builder will reject it.\n        return {\n            "sizing": sizing_grid[0],\n            "prob_10y": checkpoints.get(10, 0.0),\n            "prob_15y": checkpoints.get(15, 0.0),\n            "prob_20y": checkpoints.get(20, 0.0),\n            "bankruptcy_prob": ruined_20 if ruined_20 is not None else 100.0,\n            "p90_max_dd": worst_dd_20 if worst_dd_20 is not None else 100.0,\n        }\n    return best'''
          if old_boot not in s:
              raise SystemExit('adversarial_strategy_validator.py: bootstrap function not found')
          s = s.replace(old_boot, new_boot, 1)

          old_val = '''    lower_avg = block_bootstrap_lower(rd["return"].values) if not rd.empty else np.nan\n    validation_results.append({'''
          new_val = '''    lower_avg = (\n        block_bootstrap_lower(\n            rd["return"].values,\n            alpha=MULTIPLE_TEST_ALPHA,\n        )\n        if not rd.empty else np.nan\n    )\n    validation_results.append({'''
          if old_val not in s:
              raise SystemExit('adversarial_strategy_validator.py: validation bootstrap call not found')
          s = s.replace(old_val, new_val, 1)

          old_pass = '''        & (validation_summary.validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)\n    )'''
          new_pass = '''        & (validation_summary.validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)\n        & (validation_summary.validation_avg_lower > 0)\n    )'''
          if old_pass not in s:
              raise SystemExit('adversarial_strategy_validator.py: validation gate block not found')
          s = s.replace(old_pass, new_pass, 1)

          old_final = '''# build_strategy_policy.pyが読む正式な最終候補CSVを必ず生成\nif not final_pass.empty:\n    final_pass["final_status"] = "PASS"'''
          new_final = '''# Mandatory Monte Carlo risk gate for every final candidate.\n# Only candidates with computed MC diagnostics are eligible for automatic policy build.\nif not final_pass.empty:\n    mc_records = []\n    mc_limit = int(os.getenv("WF_MC_CANDIDATES", "20"))\n    for _, row in final_pass.head(mc_limit).iterrows():\n        rd = run_strategy(\n            oos_df, int(row.up), int(row.score), bool(row.nikkei),\n            float(row.tp), float(row.sl), int(row.hold)\n        )\n        mc = monte_carlo_risk_gate(rd)\n        if mc is None:\n            continue\n        rec = {\n            "strategy": row.strategy,\n            **mc,\n        }\n        mc_records.append(rec)\n    mc_df = pd.DataFrame(mc_records)\n    if not mc_df.empty:\n        final_pass = final_pass.merge(mc_df, on="strategy", how="inner")\n    else:\n        final_pass = pd.DataFrame()\n\n# build_strategy_policy.pyが読む正式な最終候補CSVを必ず生成\nif not final_pass.empty:\n    final_pass["final_status"] = "PASS"'''
          if old_final not in s:
              raise SystemExit('adversarial_strategy_validator.py: final candidate block not found')
          s = s.replace(old_final, new_final, 1)

          # Add N_eff diagnostics to console/Discord output if the final print exists.
          old_print = '''print("探索数:", len(param_space))\nprint("TOP_N:", TOP_N)'''
          new_print = '''print("探索数:", len(param_space))\nprint("N_eff:", N_EFFECTIVE_STRATEGIES)\nprint("Purge日数:", PURGE_DAYS, "Embargo日数:", EMBARGO_DAYS)\nprint("TOP_N:", TOP_N)'''
          if old_print not in s:
              raise SystemExit('adversarial_strategy_validator.py: final print block not found')
          s = s.replace(old_print, new_print, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check repaired files
        run: |
          python -m py_compile build_strategy_policy.py adversarial_strategy_validator.py risk_manager.py adversarial_pretty_runner.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_strategy_policy.py adversarial_strategy_validator.py risk_manager.py adversarial_pretty_runner.py strategy_policy.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: enforce adversarial gates and Monte Carlo risk checks"
          git push origin main
