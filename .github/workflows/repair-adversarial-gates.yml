name: Repair adversarial gates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safety and validation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # build_strategy_policy.py: fail-closed Monte Carlo gate.
          p = root / 'build_strategy_policy.py'
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r'mc_columns_exist = all\(col in df\.columns for col in mc_columns\)\nif not mc_columns_exist:\n    print\("⚠ Monte Carlo列がありません"\)\n    print\("Monte Carlo条件なしでは自動採用しません"\)',
              'mc_columns_exist = all(col in df.columns for col in mc_columns)\nif not mc_columns_exist:\n    keep_existing_policy("Monte Carlo列がありません。破産確率/P90 DD/到達確率を検証できないため自動採用を停止")',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('build_strategy_policy.py: MC block not found')
          p.write_text(s, encoding='utf-8')

          # risk_manager.py: safe default simultaneous positions = 3.
          p = root / 'risk_manager.py'
          s = p.read_text(encoding='utf-8')
          if 'MAX_POSITIONS = int(os.getenv("AI_MAX_POSITIONS", "20"))' in s:
              s = s.replace('MAX_POSITIONS = int(os.getenv("AI_MAX_POSITIONS", "20"))', 'MAX_POSITIONS = int(os.getenv("AI_MAX_POSITIONS", "3"))', 1)
          p.write_text(s, encoding='utf-8')

          # Bootstrap policy must not look approved.
          p = root / 'strategy_policy.json'
          policy = json.loads(p.read_text(encoding='utf-8'))
          if policy.get('source') == 'bootstrap_default' and policy.get('strategy_name') == 'BOOTSTRAP_DEFAULT_PENDING_OPTIMIZER':
              policy['status'] = 'PENDING'
          p.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Pretty runner: current optimizer title + N_eff label.
          p = root / 'adversarial_pretty_runner.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('(\"🛡️ ADVERSARIAL STRATEGY VALIDATOR\", \"🛡️ AI戦略｜敵対的検証レポート\"),', '(\"🛡️ AI PROFIT OPTIMIZER\", \"🛡️ AI戦略｜敵対的利益最適化レポート\"),', 1)
          s = s.replace('(\"N_eff近似:\", \"実質的な独立戦略数：\"),', '(\"N_eff:\", \"実質的な独立戦略数：\"),', 1)
          p.write_text(s, encoding='utf-8')

          # Adversarial validator: Purge/Embargo + conservative N_eff multiple-test correction.
          p = root / 'adversarial_strategy_validator.py'
          s = p.read_text(encoding='utf-8')
          old_split = '''oos_dates = all_dates[-OOS_DAYS:]\npre_oos = all_dates[:-OOS_DAYS]\nsplit = int(len(pre_oos) * 0.60)\ndev_dates = pre_oos[:split]\nvalidation_dates = pre_oos[split:]\nphase_map = {d: "DEV" for d in dev_dates}\nphase_map.update({d: "VALIDATION" for d in validation_dates})\nphase_map.update({d: "OOS" for d in oos_dates})\ncandidates["phase"] = candidates["date"].map(phase_map)'''
          new_split = '''oos_dates = all_dates[-OOS_DAYS:]\npre_oos = all_dates[:-OOS_DAYS]\nsplit = int(len(pre_oos) * 0.60)\nraw_dev_dates = pre_oos[:split]\nraw_validation_dates = pre_oos[split:]\npurge_n = max(0, min(PURGE_DAYS, len(raw_dev_dates) - 1))\nembargo_n = max(0, min(EMBARGO_DAYS, len(raw_validation_dates) - 1))\ndev_dates = raw_dev_dates[:-purge_n] if purge_n else raw_dev_dates\nvalidation_dates = raw_validation_dates[embargo_n:]\nif not dev_dates or not validation_dates:\n    raise RuntimeError("Purge/Embargo後にDEVまたはValidation期間が空です")\nphase_map = {d: "DEV" for d in dev_dates}\nphase_map.update({d: "VALIDATION" for d in validation_dates})\nphase_map.update({d: "OOS" for d in oos_dates})\ncandidates["phase"] = candidates["date"].map(phase_map)\nN_EFFECTIVE_STRATEGIES = max(1, int(np.ceil(np.sqrt(len(UP_THRESHOLDS) * len(SCORE_THRESHOLDS) * len(NIKKEI_FILTERS) * len(TP_MULTIPLIERS) * len(SL_MULTIPLIERS) * len(HOLD_DAYS_LIST)))))\nMULTIPLE_TEST_ALPHA = 0.05 / N_EFFECTIVE_STRATEGIES'''
          if old_split in s:
              s = s.replace(old_split, new_split, 1)
          elif 'N_EFFECTIVE_STRATEGIES' not in s:
              raise SystemExit('adversarial_strategy_validator.py: phase split block not found')

          # Add risk-unit field to each evaluated trade for risk-based MC sizing.
          if '"risk_unit": max(1e-8, float(atr_ratio) / 100.0 * float(sl))' not in s:
              pattern = r'("hold_days": days,\n\s+"phase": r\["phase"\],\n)(\s+\}\))'
              s, n = re.subn(pattern, r'\1                "risk_unit": max(1e-8, float(atr_ratio) / 100.0 * float(sl)),\n\2', s, count=1)
              if n != 1:
                  raise SystemExit('adversarial_strategy_validator.py: trade row not found')

          # Replace bootstrap lower bound with configurable family-wise alpha and add MC gate.
          old_boot = '''def block_bootstrap_lower(values, block_len=10, n_iter=BOOTSTRAP_ITERATIONS):\n    values = np.asarray(values, dtype=float)\n    if len(values) < 10:\n        return np.nan\n    rng = np.random.default_rng(RANDOM_SEED)\n    n = len(values)\n    starts = np.arange(max(1, n - block_len + 1))\n    out = []\n    for _ in range(n_iter):\n        sample = []\n        while len(sample) < n:\n            s = int(rng.choice(starts))\n            sample.extend(values[s:s + block_len])\n        out.append(float(np.mean(sample[:n])))\n    return float(np.quantile(out, 0.05))'''
          new_boot = '''def block_bootstrap_lower(values, block_len=10, n_iter=BOOTSTRAP_ITERATIONS, alpha=0.05):\n    values = np.asarray(values, dtype=float)\n    values = values[np.isfinite(values)]\n    if len(values) < 10:\n        return np.nan\n    rng = np.random.default_rng(RANDOM_SEED)\n    n = len(values)\n    starts = np.arange(max(1, n - block_len + 1))\n    out = []\n    for _ in range(n_iter):\n        sample = []\n        while len(sample) < n:\n            start = int(rng.choice(starts))\n            sample.extend(values[start:start + block_len])\n        out.append(float(np.mean(sample[:n])))\n    return float(np.quantile(out, max(1e-6, min(0.5, alpha))))\n\n\ndef monte_carlo_risk_gate(trades, initial_capital=INITIAL_CAPITAL, target_capital=100000000.0, iterations=None):\n    iterations = int(iterations or int(os.getenv("WF_MONTE_CARLO_ITERATIONS", "5000")))\n    if trades is None or trades.empty or "return" not in trades or "risk_unit" not in trades:\n        return None\n    ret = pd.to_numeric(trades["return"], errors="coerce").to_numpy(dtype=float)\n    unit = pd.to_numeric(trades["risk_unit"], errors="coerce").to_numpy(dtype=float)\n    mask = np.isfinite(ret) & np.isfinite(unit) & (unit > 0)\n    r_mult = (ret[mask] / 100.0) / unit[mask]\n    r_mult = r_mult[np.isfinite(r_mult)]\n    if len(r_mult) < 20:\n        return None\n    years = max(0.5, (trades["date"].max() - trades["date"].min()).days / 365.25)\n    annual_signals = max(1.0, len(r_mult) / years)\n    rng = np.random.default_rng(RANDOM_SEED)\n    best = None\n    diagnostic = None\n    for sizing in (0.01, 0.0075, 0.005, 0.0025):\n        path = np.full(iterations, float(initial_capital))\n        peak = path.copy()\n        max_dd = np.zeros(iterations)\n        checkpoints = {}\n        for year in range(1, 21):\n            n = max(1, int(round(annual_signals)))\n            sample = rng.choice(r_mult, size=(iterations, n), replace=True)\n            growth = np.prod(np.clip(1.0 + sizing * sample, 0.01, 5.0), axis=1)\n            path *= growth\n            peak = np.maximum(peak, path)\n            max_dd = np.maximum(max_dd, 1.0 - path / np.maximum(peak, 1e-9))\n            if year in (10, 15, 20):\n                checkpoints[year] = float(np.mean(path >= target_capital) * 100.0)\n        bankruptcy = float(np.mean(path <= initial_capital * 0.50) * 100.0)\n        p90_dd = float(np.quantile(max_dd, 0.90) * 100.0)\n        diagnostic = {"sizing": sizing, "prob_10y": checkpoints[10], "prob_15y": checkpoints[15], "prob_20y": checkpoints[20], "bankruptcy_prob": bankruptcy, "p90_max_dd": p90_dd}\n        if bankruptcy < 5.0 and p90_dd <= 30.0:\n            best = diagnostic\n            break\n    return best or diagnostic'''
          if old_boot in s:
              s = s.replace(old_boot, new_boot, 1)
          elif 'def monte_carlo_risk_gate(' not in s:
              raise SystemExit('adversarial_strategy_validator.py: bootstrap function not found')

          # Use family-wise corrected bootstrap lower bound as an explicit Validation gate.
          if 'alpha=MULTIPLE_TEST_ALPHA' not in s:
              s = s.replace('lower_avg = block_bootstrap_lower(rd["return"].values) if not rd.empty else np.nan',
                            'lower_avg = block_bootstrap_lower(rd["return"].values, alpha=MULTIPLE_TEST_ALPHA) if not rd.empty else np.nan', 1)
              s = s.replace('& (validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)',
                            '& (validation_monthly_positive_ratio >= MIN_MONTHLY_POSITIVE_RATIO * 100)\n        & (validation_summary.validation_avg_lower > 0)', 1) if 'validation_summary.validation_monthly_positive_ratio' not in s else s

          # Mandatory MC on final candidates; rows without MC data are excluded from the policy CSV.
          if 'Mandatory Monte Carlo risk gate' not in s:
              marker = '# build_strategy_policy.pyが読む正式な最終候補CSVを必ず生成\nif not final_pass.empty:'
              inject = '''# Mandatory Monte Carlo risk gate.\nif not final_pass.empty:\n    mc_records = []\n    mc_limit = int(os.getenv("WF_MC_CANDIDATES", "20"))\n    for _, row in final_pass.head(mc_limit).iterrows():\n        rd = run_strategy(oos_df, int(row.up), int(row.score), bool(row.nikkei), float(row.tp), float(row.sl), int(row.hold))\n        mc = monte_carlo_risk_gate(rd)\n        if mc is not None:\n            mc_records.append({"strategy": row.strategy, **mc})\n    mc_df = pd.DataFrame(mc_records)\n    final_pass = final_pass.merge(mc_df, on="strategy", how="inner") if not mc_df.empty else pd.DataFrame()\n\n# build_strategy_policy.pyが読む正式な最終候補CSVを必ず生成\nif not final_pass.empty:'''
              if marker not in s:
                  raise SystemExit('adversarial_strategy_validator.py: final candidate marker not found')
              s = s.replace(marker, inject, 1)

          # Report N_eff in output.
          if 'print("N_eff:", N_EFFECTIVE_STRATEGIES)' not in s:
              s = s.replace('print("探索数:", len(param_space))\nprint("TOP_N:", TOP_N)',
                            'print("探索数:", len(param_space))\nprint("N_eff:", N_EFFECTIVE_STRATEGIES)\nprint("Purge/Embargo:", PURGE_DAYS, EMBARGO_DAYS)\nprint("TOP_N:", TOP_N)', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check repaired files
        run: python -m py_compile build_strategy_policy.py adversarial_strategy_validator.py risk_manager.py adversarial_pretty_runner.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_strategy_policy.py adversarial_strategy_validator.py risk_manager.py adversarial_pretty_runner.py strategy_policy.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: enforce adversarial gates and Monte Carlo risk checks"
          git push origin main
