name: Live Model Policy Validation (research-only)

# 研究専用: 本番のTOP1ペーパートレード(daily_directional_top1.py /
# daily_model_retrain.py / profit_top10_paper.py)と全く同じモデル学習ロジック・
# 全く同じ日次選定/決済ロジックで、リーク無しウォークフォワードにより承認済み
# policy(strategy_policy.json / strategy_policy_up.json)の実際のOOS成績を測定する。
# このワークフローはlive_model_policy_validation.pyだけを実行し、他のどの
# ライブファイルも変更・コミットしない(workflow_dispatchのみ、pushトリガーなし、
# git commit/pushステップ無し。成果物はActions artifactとstep summaryのみ)。
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '検証開始日 (YYYY-MM-DD)'
        required: false
        default: '2022-01-01'
      end_date:
        description: '検証終了日 (YYYY-MM-DD、空なら実行日)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: stock-ai-live-model-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
      LMV_START_DATE: ${{ github.event.inputs.start_date }}
      LMV_END_DATE: ${{ github.event.inputs.end_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile live_model_policy_validation.py
          python -m py_compile test_live_model_policy_validation.py

      - name: Run live model + policy walk-forward validation
        run: python live_model_policy_validation.py

      - name: Append results to step summary
        if: always()
        run: |
          {
            echo '## Live Model Policy Validation'
            echo ''
            if [ -f live_model_policy_validation_results.json ]; then
              python - <<'PY'
              import json
              with open('live_model_policy_validation_results.json', encoding='utf-8') as f:
                  print(json.dumps(json.load(f), ensure_ascii=False, indent=2)[:60000])
              PY
            else
              echo 'live_model_policy_validation_results.json が生成されませんでした(スクリプト失敗の可能性)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-model-policy-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            live_model_policy_validation_results.json
            live_model_policy_validation_trades_*.csv
