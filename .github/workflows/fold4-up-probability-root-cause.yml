name: Fold 4 UP Probability Root Cause Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - walk_forward_exact_pipeline_trace.py
      - .github/workflows/fold4-up-probability-root-cause.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance scikit-learn requests

      # ★変更(2026-09): walk_forward_all_candidates.csv.gzはもうgit管理対象
      # ではなく、GitHub Release(walk-forward-candidates-latest)のアセットとして
      # 配布される(refresh-walk-forward-candidates.yml参照)。checkout直後に
      # releaseからダウンロードし、ダウンロードに失敗した場合のみ、まだgit管理
      # 下に残っている可能性のある.gz(移行期のフォールバック)を使う。どちらも
      # 無ければジョブを失敗させる。
      - name: Materialize candidates CSV from release or compressed git storage
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            GZ_FROM_GIT=0
            [ -f walk_forward_all_candidates.csv.gz ] && GZ_FROM_GIT=1
            DOWNLOADED=0
            for i in 1 2 3; do
              if curl -fL -o walk_forward_all_candidates.csv.gz.tmp \
                "https://github.com/aifuu/stock-ai/releases/download/walk-forward-candidates-latest/walk_forward_all_candidates.csv.gz"; then
                mv -f walk_forward_all_candidates.csv.gz.tmp walk_forward_all_candidates.csv.gz
                DOWNLOADED=1
                break
              fi
              rm -f walk_forward_all_candidates.csv.gz.tmp
              echo "⚠️ release資産のダウンロード失敗 (試行${i}/3)"
              sleep $((i * 5))
            done
            if [ "$DOWNLOADED" != "1" ]; then
              if [ "$GZ_FROM_GIT" = "1" ]; then
                echo '⚠️ releaseダウンロードに失敗したため、git管理下の.gz(移行期のフォールバック)を使用します'
              else
                echo '❌ walk_forward_all_candidates.csv.gzが見つかりません(release資産のダウンロードに失敗し、git管理下のフォールバックも存在しません)'
                exit 1
              fi
            fi
            gunzip -k walk_forward_all_candidates.csv.gz
          fi
          test -s walk_forward_all_candidates.csv

      - name: Verify candidate CSV
        run: |
          test -s walk_forward_all_candidates.csv
          python - <<'PY'
          import pandas as pd
          p='walk_forward_all_candidates.csv'
          df=pd.read_csv(p)
          print('candidate rows:',len(df))
          print('columns:',', '.join(df.columns))
          print('last date:',df['date'].max())
          PY

      - name: Run Fold 4 UP probability root-cause diagnostic
        run: python fold4_up_probability_root_cause_diagnostic.py

      - name: Run EXACT walk-forward candidate pipeline trace
        run: python walk_forward_exact_pipeline_trace.py

      - name: Verify exact trace artifact
        run: |
          test -s walk_forward_exact_pipeline_trace.csv
          cat walk_forward_exact_pipeline_trace.csv

      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fold4-up-probability-root-cause
          path: |
            fold4_up_probability_root_cause.csv
            fold4_up_probability_root_cause_detail.csv
            walk_forward_exact_pipeline_trace.csv
          if-no-files-found: error
