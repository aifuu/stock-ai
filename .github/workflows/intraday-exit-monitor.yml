name: 毎日デイトレ 5分足 自動決済監視

on:
  schedule:
    # JST 10:05〜15:25を5分ごとに監視
    - cron: '5-55/5 1 * * 1-5'
    - cron: '*/5 2-5 * * 1-5'
    - cron: '0-25/5 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# mainへ書き込む全workflowと同じロックを使い、
# fetch/rebase/pushの間に別workflowが割り込む競合を防止する。
concurrency:
  group: ai-stock-scan-main-write
  cancel-in-progress: false

jobs:
  exit-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests jpholiday

      - name: Syntax check
        run: python -m py_compile intraday_exit_monitor.py

      - name: Run exit monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          IT_FEE_RATE: '0.00055'
        run: python intraday_exit_monitor.py

      - name: Commit intraday paper result safely
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_intraday_history.csv intraday_auto_entry_state.json 2>/dev/null || true
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update intraday paper trade exit state'

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo '✅ exit state push成功'
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "⚠️ exit state push競合、再試行: $i/5"
            git fetch origin main
            git reset --hard origin/main
            sleep $((i * 3))
            # 状態ファイルはrunner上の作業結果から再生成できないため、
            # 通常はconcurrencyロックでここへ到達しない。
          done
          echo '❌ exit state push失敗'
          exit 1

      - name: Upload intraday paper history
        uses: actions/upload-artifact@v4
        with:
          name: intraday-paper-history-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            paper_intraday_history.csv
            intraday_auto_entry_state.json
