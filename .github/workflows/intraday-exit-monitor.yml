name: 毎日デイトレ 5分足 自動決済監視

on:
  schedule:
    # JST 10:05〜15:25を5分ごとに監視
    # UTC 01:05〜06:25、平日のみ
    - cron: '5-55/5 1 * * 1-5'
    - cron: '*/5 2-5 * * 1-5'
    - cron: '0-25/5 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-exit-monitor
  cancel-in-progress: false

jobs:
  exit-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests jpholiday

      - name: Syntax check
        run: |
          python -m py_compile intraday_exit_monitor.py

      - name: Run exit monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          IT_FEE_RATE: '0.00055'
        run: python intraday_exit_monitor.py

      - name: Commit intraday paper result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper_intraday_history.csv intraday_auto_entry_state.json || true
          if git diff --cached --quiet; then
            echo 'デイトレ決済状態の変更なし'
          else
            git commit -m 'chore: update intraday paper trade exit state' || true
            PUSH_SUCCESS=false
            for i in 1 2 3; do
              if git push; then
                echo '✅ push成功'
                PUSH_SUCCESS=true
                break
              fi
              echo "⚠ push失敗、再試行 ($i/3)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              sleep 3
            done
            if [ "$PUSH_SUCCESS" != 'true' ]; then
              echo '❌ 3回ともpush失敗'
              exit 1
            fi
          fi

      - name: Upload intraday paper history
        uses: actions/upload-artifact@v4
        with:
          name: intraday-paper-history-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            paper_intraday_history.csv
            intraday_auto_entry_state.json
