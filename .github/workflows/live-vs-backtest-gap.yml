name: ライブ対バックテスト ギャップ分析 (live_vs_backtest_gap)

# read-onlyの診断。workflow_dispatchのみ(スケジュール無し)。
# 実際のyfinance日足データ取得が必要なため、ネットワークがあるGitHub Actions上
# で実行する。adversarial_strategy_validator.pyや各種live trading script
# (profit_top10_paper.py / run_profit_loop.py / daytrade_tp5000_sl8000_paper.py 等)
# は一切importも変更もせず、live_vs_backtest_gap.pyから読むだけ。

on:
  workflow_dispatch:
    inputs:
      since_date:
        description: "対象開始日 (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"

permissions:
  contents: write

concurrency:
  group: stock-ai-live-vs-backtest-gap
  cancel-in-progress: false

jobs:
  gap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Syntax check
        run: python -m py_compile live_vs_backtest_gap.py

      - name: Run live vs backtest gap analysis
        env:
          GAP_SINCE_DATE: ${{ github.event.inputs.since_date || '2026-09-01' }}
        run: python live_vs_backtest_gap.py

      - name: Show output preview
        run: |
          echo "===== live_vs_backtest_gap.csv (head) ====="
          head -n 5 live_vs_backtest_gap.csv || true
          echo "===== live_vs_backtest_gap.md (head) ====="
          head -n 40 live_vs_backtest_gap.md || true

      - name: Commit output files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live_vs_backtest_gap.csv 2>/dev/null || true
          git add live_vs_backtest_gap.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update live vs backtest gap analysis [skip ci]'
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ live-vs-backtest-gap push成功'
              PUSH_OK=1
              break
            fi
            git rebase --abort || true
            sleep $((i*3))
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo '❌ live-vs-backtest-gap push失敗'
            exit 1
          fi

      - name: Send Discord summary (optional)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK未設定のため通知をスキップ"
            exit 0
          fi
          python - <<'PY' || true
          import os
          import requests

          webhook = os.environ["DISCORD_WEBHOOK"]
          try:
              with open("live_vs_backtest_gap.md", encoding="utf-8") as f:
                  text = f.read()
              preview = text[:1500]
              msg = "📊 ライブ対バックテスト ギャップ分析 (read-only)\n" + preview
              requests.post(webhook, json={"content": msg[:1900]}, timeout=30).raise_for_status()
              print("Discord通知送信完了")
          except Exception as e:
              print("Discord通知に失敗しましたが、ジョブは失敗させません:", e)
          PY
