name: 検証失敗内訳診断 (validation_failure_breakdown)

# read-onlyの診断。adversarial_strategy_validator.pyやどのpolicyファイルも
# importも変更もしない。既存のadversarial_*_{up,down}.csv等を読むだけ。

on:
  # 週次オプティマイザ(土曜深夜実行)の後、日曜09:30 JST(UTC 00:30)頃に実行。
  schedule:
    - cron: '30 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-ai-validation-failure-breakdown
  cancel-in-progress: false

jobs:
  breakdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Syntax check
        run: python -m py_compile validation_failure_breakdown.py

      - name: Run validation failure breakdown
        run: python validation_failure_breakdown.py

      - name: Show output preview
        run: |
          echo "===== validation_failure_breakdown.csv (head) ====="
          head -n 5 validation_failure_breakdown.csv || true
          echo "===== validation_failure_summary.md (head) ====="
          head -n 40 validation_failure_summary.md || true

      - name: Commit output files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation_failure_breakdown.csv 2>/dev/null || true
          git add validation_failure_summary.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update validation failure breakdown [skip ci]'
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ validation-failure-breakdown push成功'
              PUSH_OK=1
              break
            fi
            git rebase --abort || true
            sleep $((i*3))
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo '❌ validation-failure-breakdown push失敗'
            exit 1
          fi

      - name: Send Discord summary (optional)
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK未設定のため通知をスキップ"
            exit 0
          fi
          python - <<'PY' || true
          import os
          import requests

          webhook = os.environ["DISCORD_WEBHOOK"]
          try:
              with open("validation_failure_summary.md", encoding="utf-8") as f:
                  text = f.read()
              preview = text[:1500]
              msg = "📊 検証失敗内訳診断 (read-only)\n" + preview
              requests.post(webhook, json={"content": msg[:1900]}, timeout=30).raise_for_status()
              print("Discord通知送信完了")
          except Exception as e:
              print("Discord通知に失敗しましたが、ジョブは失敗させません:", e)
          PY
