name: AI Profit Optimizer - 4 Fold OOS Profit Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 6'

permissions:
  contents: write

concurrency:
  group: stock-ai-profit-optimizer
  cancel-in-progress: false

env:
  WF_START_DATE: '2018-01-01'
  # ★修正(2026-09): 本番(run_profit_loop.py)はTOP10全件ではなくTOP1のみ建てる。
  # TOP_N=10のままだと、承認policyの検証成績(月間収益率・PF・複利)が
  # 「TOP10に分散した場合の平均リターン」になり、実際のTOP1集中運用の成績とは
  # 統計的性質が異なっていた。TOP1に合わせる。
  WF_TOP_N: '1'
  WF_MULTI_OOS_FOLDS: '4'
  WF_MULTI_OOS_DAYS: '239'
  WF_INITIAL_CAPITAL: '1000000'
  WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
  WF_MAX_OOS_DD: '35'
  WF_MIN_POSITIVE_FOLDS: '1'
  WF_MIN_TOTAL_OOS_TRADES: '12'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile adversarial_strategy_validator.py
          python -m py_compile multi_oos_profit_gate.py
          python -m py_compile adversarial_oos_diagnostic.py
          python -m py_compile build_strategy_policy.py

      # ★変更(2026-09): walk_forward_all_candidates.csv.gzはもうgit管理対象
      # ではなく、GitHub Release(walk-forward-candidates-latest)のアセットとして
      # 配布される(refresh-walk-forward-candidates.yml参照)。checkout直後に
      # releaseからダウンロードし、ダウンロードに失敗した場合のみ、まだgit管理
      # 下に残っている可能性のある.gz(移行期のフォールバック)を使う。どちらも
      # 無ければ(このワークフローだけは)次の"Build candidates when needed"の
      # ゼロからの再生成フォールバックに委ねる(このワークフローの既存の
      # 再生成フォールバックを壊さないよう、ここではジョブを失敗させない)。
      # ゲート条件・探索範囲・検証ロジックは変更していない。
      - name: Materialize candidates CSV from release or compressed git storage
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            GZ_FROM_GIT=0
            [ -f walk_forward_all_candidates.csv.gz ] && GZ_FROM_GIT=1
            DOWNLOADED=0
            for i in 1 2 3; do
              if curl -fL -o walk_forward_all_candidates.csv.gz.tmp \
                "https://github.com/aifuu/stock-ai/releases/download/walk-forward-candidates-latest/walk_forward_all_candidates.csv.gz"; then
                mv -f walk_forward_all_candidates.csv.gz.tmp walk_forward_all_candidates.csv.gz
                DOWNLOADED=1
                break
              fi
              rm -f walk_forward_all_candidates.csv.gz.tmp
              echo "⚠️ release資産のダウンロード失敗 (試行${i}/3)"
              sleep $((i * 5))
            done
            if [ "$DOWNLOADED" != "1" ] && [ "$GZ_FROM_GIT" = "1" ]; then
              echo '⚠️ releaseダウンロードに失敗したため、git管理下の.gz(移行期のフォールバック)を使用します'
            fi
            if [ -f walk_forward_all_candidates.csv.gz ]; then
              gunzip -k walk_forward_all_candidates.csv.gz
            else
              echo '⚠️ walk_forward_all_candidates.csv.gzが見つかりません。次のBuild candidates when neededでゼロから再生成します。'
            fi
          fi

      - name: Build candidates when needed
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            python daily_model_retrain.py
            python walk_forward.py
          fi
          test -s walk_forward_all_candidates.csv

      - name: Run 4 independent OOS profit gate
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python multi_oos_profit_gate.py

      - name: Build OOS diagnostic input from all Fold results
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path('multi_oos_results')
          files = sorted(root.glob('fold_*/adversarial_oos_results.csv'))
          rows = []
          print('============================================================')
          print('🔧 BUILD OOS DIAGNOSTIC INPUT')
          print('目的: 4 Foldの実OOS結果を診断スクリプトへ確実に受け渡す')
          print('ゲート条件・探索閾値・policyは変更しない')
          print('============================================================')

          for path in files:
              try:
                  df = pd.read_csv(path)
              except Exception as e:
                  print(f'⚠ 読み込み失敗: {path}: {e}')
                  continue
              if df.empty:
                  print(f'⚠ 空ファイル: {path}')
                  continue
              fold_text = path.parent.name
              try:
                  fold_no = int(fold_text.split('_')[-1])
              except ValueError:
                  print(f'⚠ Fold番号を取得できないためスキップ: {path}')
                  continue
              df = df.copy()
              df['diagnostic_fold'] = fold_no
              rows.append(df)
              print(f'✅ {path}: {len(df)} rows / Fold {fold_no}')

          out = Path('adversarial_multi_oos_folds.csv')
          if rows:
              merged = pd.concat(rows, ignore_index=True, sort=False)
              if 'fold' not in merged.columns:
                  merged['fold'] = merged['diagnostic_fold']
              else:
                  merged['fold'] = pd.to_numeric(merged['fold'], errors='coerce').fillna(merged['diagnostic_fold']).astype(int)
              merged.to_csv(out, index=False, encoding='utf-8-sig')
              print(f'📁 {out}: {len(merged)} rows / {merged["fold"].nunique()} folds')
              print('列:', ', '.join(merged.columns))
          else:
              # 診断側が「入力なし」と明示できるよう、空CSVを作る。
              pd.DataFrame().to_csv(out, index=False)
              print(f'⚠ {out}: 診断対象データなし')
          PY

      - name: Run OOS failure diagnosis
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WF_OOS_FOLDS: '4'
          WF_MIN_POSITIVE_FOLDS: '1'
          WF_MIN_TOTAL_OOS_TRADES: '12'
          WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
          WF_MAX_OOS_DD: '35'
        run: |
          echo '============================================================'
          echo '🔎 OOS不合格診断'
          echo '目的: OOS PASS=0 の原因を戦略ごとに可視化する'
          echo '重要: ゲート条件・探索閾値・policyは変更しない'
          echo '優先目標: 毎月収益プラス / 収益率優先 / 月次5%目標'
          echo '============================================================'
          python adversarial_oos_diagnostic.py

      - name: Verify threshold funnel diagnostics without changing gates
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          src = Path('walk_forward_all_candidates.csv')
          out = Path('multi_oos_threshold_diagnostics.csv')
          c = pd.read_csv(src)
          c['date'] = pd.to_datetime(c['date'], errors='coerce').dt.normalize()
          for col in ['up_prob','down_prob','flat_prob','score']:
              c[col] = pd.to_numeric(c[col], errors='coerce')
          c['nikkei_uptrend'] = c['nikkei_uptrend'].astype(str).str.lower().isin(['true','1','yes'])
          c = c.dropna(subset=['date','up_prob','down_prob','flat_prob','score'])
          dates = sorted(c['date'].drop_duplicates())
          folds, oos_days, purge, embargo = 4, 239, 7, 7
          rows = []
          for fold in range(1, folds+1):
              end_pos = len(dates) - (folds-fold)*oos_days
              oos = dates[end_pos-oos_days:end_pos]
              pre = dates[:max(0, end_pos-oos_days)]
              cut = int(len(pre)*0.60)
              dev = pre[:max(1,cut-purge)]
              val = pre[min(len(pre),cut+embargo):]
              for phase, ds in [('DEV',dev),('VALIDATION',val),('OOS',oos)]:
                  x=c[c.date.isin(ds)]
                  for up in [45,50,55,60,65]:
                      for score in [50,60,70,80]:
                          for nikkei in [False,True]:
                              y=x[(x.up_prob>=up)&(x.up_prob>x.down_prob)&(x.flat_prob<50)&(x.score>=score)]
                              if nikkei: y=y[y.nikkei_uptrend]
                              rows.append({'fold':fold,'phase':phase,'up':up,'score':score,'nikkei':nikkei,'candidate_count':len(y)})
          d=pd.DataFrame(rows)
          d.to_csv(out,index=False,encoding='utf-8-sig')
          print(f'診断CSV: {out} / {len(d)} rows')
          print(d.sort_values(['fold','phase','candidate_count'],ascending=[True,True,False]).groupby(['fold','phase']).head(5).to_string(index=False))
          print('※診断専用。PASS条件・policy・閾値は変更しません。')
          PY

      # ★変更(PLAN B, 2026-09): このワークフローはもうライブのstrategy_policy.jsonを
      # 一切書かない。BSP_POLICY_FILEをcandidates/配下の別ファイル名に向け、
      # ここで生成されるのは常に「候補(candidate)」であり、ユーザーの明示的な
      # 承認作業(署名済みcandidateファイルをそのままrootへbyte-identicalコピー)
      # を経なければ本番では絶対に使われない。build_strategy_policy.py自体は
      # 変更していない(署名ペイロードはファイル名を含まないため、コピーしても
      # 署名は有効なまま)。
      - name: Build verified policy (candidate only — live policy files are never written)
        env:
          BSP_POLICY_FILE: candidates/candidate_strategy_policy.json
        run: |
          mkdir -p candidates
          python build_strategy_policy.py

      - name: Show selected policy (candidate)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('candidates/candidate_strategy_policy.json')
          if not path.exists():
              print('candidateファイル未生成(PASS候補なし、または最低保持期間中で現行candidateを維持)')
          else:
              with open(path, encoding='utf-8') as f:
                  p = json.load(f)
              print('===== 4-FOLD PROFIT-FIRST POLICY (CANDIDATE — 未昇格/未本番反映) =====')
              print('status:', p.get('status'))
              print('strategy:', p.get('strategy_name'))
              print('monthly positive:', p.get('oos_monthly_positive_ratio'), '%')
              print('OOS compound:', p.get('oos_compound_return'), '%')
              print('OOS final capital:', p.get('oos_compound_final_capital'))
              print('expected value:', p.get('oos_expected_value'), '%')
              print('PF:', p.get('oos_pf'))
              print('max DD:', p.get('oos_dd'), '%')
              print('MC bankruptcy:', p.get('mc_bankruptcy_probability'), '%')
              print('MC p90 DD:', p.get('mc_p90_max_dd'), '%')
          PY

      # 純粋な読み取り専用比較(JSONを読むだけ、署名計算やrepoモジュールの
      # importは一切行わない)。ライブpolicyとcandidateの差分を可視化するだけで、
      # どちらのファイルも書き換えない。
      - name: Compare candidate vs live policy (read-only, no signature ops)
        env:
          CMP_CANDIDATE_FILE: candidates/candidate_strategy_policy.json
          CMP_LIVE_FILE: strategy_policy.json
          CMP_LABEL: 'main (strategy_policy.json)'
          CMP_OUT_FILE: candidates/latest_comparison.md
        run: |
          mkdir -p candidates
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          CANDIDATE = os.environ['CMP_CANDIDATE_FILE']
          LIVE = os.environ['CMP_LIVE_FILE']
          LABEL = os.environ['CMP_LABEL']
          OUT_MD = os.environ['CMP_OUT_FILE']

          CORE_FIELDS = [
              'up_threshold', 'min_score_for_buy', 'nikkei_filter',
              'atr_tp_multiplier', 'atr_sl_multiplier', 'hold_days', 'strategy_name',
          ]

          def load(path):
              p = Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'⚠ {path} 読み込み失敗: {e}')
                  return None

          def row(label, policy, note=''):
              if policy is None:
                  return f"| {label} | - | - | - | - | - | - | - | - | - | - | - | - | - | {note} |"
              return (
                  f"| {label} "
                  f"| {policy.get('strategy_name','')} "
                  f"| {policy.get('up_threshold','')} "
                  f"| {policy.get('min_score_for_buy','')} "
                  f"| {policy.get('nikkei_filter','')} "
                  f"| {policy.get('atr_tp_multiplier','')} "
                  f"| {policy.get('atr_sl_multiplier','')} "
                  f"| {policy.get('hold_days','')} "
                  f"| {policy.get('validation_pf','')} "
                  f"| {policy.get('oos_pf','')} "
                  f"| {policy.get('oos_dd','')} "
                  f"| {policy.get('oos_avg_month_return','')} "
                  f"| {policy.get('oos_signals','')} "
                  f"| {policy.get('status','')} ({policy.get('updated_at','')}) "
                  f"| {note} |"
              )

          candidate = load(CANDIDATE)
          live = load(LIVE)

          header = (
              "| kind | strategy_name | up_threshold | min_score_for_buy | nikkei_filter | "
              "TP | SL | hold_days | validation_pf | oos_pf | oos_dd | oos_avg_month_return | "
              "oos_signals | status(updated_at) | note |\n"
              "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
          )

          lines = [f"# Candidate vs Live Policy Comparison — {LABEL}", "", header]
          lines.append(row('LIVE', live, '' if live is not None else 'ファイルなし'))
          lines.append(row('CANDIDATE', candidate, '' if candidate is not None else 'ファイルなし(未生成)'))
          lines.append('')

          if candidate is None:
              verdict = 'DIFFERENT'
              lines.append(f'判定: {verdict} — candidateファイルが存在しません(今回PASS候補なし、または保持期間中で更新なし)')
          elif live is None:
              verdict = 'DIFFERENT'
              lines.append(f'判定: {verdict} — LIVEファイルが存在しません(比較対象なし)')
          else:
              same_core = all(candidate.get(k) == live.get(k) for k in CORE_FIELDS)
              verdict = 'SAME' if same_core else 'DIFFERENT'
              lines.append(f'判定: {verdict}')

          lines.append('')
          lines.append('LIVE FILES UNCHANGED')
          lines.append('')

          out_text = '\n'.join(lines) + '\n'
          Path(OUT_MD).write_text(out_text, encoding='utf-8')
          print(out_text)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(out_text)
          PY

      # 防御的多層化: 直前までのどのステップも本来ライブpolicyファイルへは
      # 一切触れていないはずだが、将来の変更でこの不変条件が壊れた場合に
      # コミット前に確実にジョブを失敗させる最終ガード。
      - name: 'Guard: live policy files must stay untouched'
        run: |
          CHANGED=$(git status --porcelain -- strategy_policy.json strategy_policy_up.json strategy_policy_down.json policy_manual_overrides.json)
          if [ -n "$CHANGED" ]; then
            echo '❌ 安全ガード: ライブpolicyファイルへの変更を検出したため中断します'
            echo "$CHANGED"
            exit 1
          fi
          echo '✅ ライブpolicyファイルは変更されていません(strategy_policy.json / strategy_policy_up.json / strategy_policy_down.json / policy_manual_overrides.json)'

      - name: Commit optimizer outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # candidates/candidate_strategy_policy.json は「今回PASS候補なし」等で
          # 生成されないことがあるため、他のCSV群と同じgit addにまとめない
          # (git addは指定パスのうち1つでも存在しないと、そのgit add呼び出し
          # 全体が何もstageせず失敗する。混ぜるとCSV群まで巻き添えで
          # stageされなくなる)。
          git add candidates/candidate_strategy_policy.json 2>/dev/null || true
          git add candidates/latest_comparison.md 2>/dev/null || true
          git add adversarial_dev_all_results.csv adversarial_dev_selected_candidates.csv adversarial_validation_results.csv adversarial_oos_results.csv adversarial_final_candidates.csv adversarial_oos_diagnostics.csv adversarial_oos_near_miss.csv adversarial_multi_oos_folds.csv multi_oos_folds.csv multi_oos_results/ multi_oos_fold_funnel.csv multi_oos_threshold_diagnostics.csv 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m 'fix: connect all fold OOS results to failure diagnostics [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ 4 Fold OOS optimizer outputs pushed'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ push failed'
          exit 1

      - name: Upload optimizer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profit-optimizer-4fold-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            adversarial_dev_all_results.csv
            adversarial_dev_selected_candidates.csv
            adversarial_validation_results.csv
            adversarial_oos_results.csv
            adversarial_final_candidates.csv
            adversarial_multi_oos_folds.csv
            adversarial_oos_diagnostics.csv
            adversarial_oos_near_miss.csv
            multi_oos_folds.csv
            multi_oos_results/**
            multi_oos_fold_funnel.csv
            multi_oos_threshold_diagnostics.csv
            candidates/candidate_strategy_policy.json
            candidates/latest_comparison.md

  # 案3拡張: 先物トレンド軸(上昇/下落)専用のTOP1戦略を週次で別途算出する。
  # 既存の本番ジョブ(strategy_policy.json)には一切影響しない。
  # strategy_policy_up.json / strategy_policy_down.json が両方生成されるまでは
  # profit_top10_paper.py は従来通りstrategy_policy.jsonにフォールバックする。
  validate_trend_variants:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        trend: [up, down]
    env:
      AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
      WF_TREND_FILTER: ${{ matrix.trend }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile futures_trend.py
          python -m py_compile adversarial_strategy_validator.py
          python -m py_compile multi_oos_profit_gate.py
          python -m py_compile build_strategy_policy.py

      # ★変更(2026-09): walk_forward_all_candidates.csv.gzはもうgit管理対象
      # ではなく、GitHub Release(walk-forward-candidates-latest)のアセットとして
      # 配布される(refresh-walk-forward-candidates.yml参照)。checkout直後に
      # releaseからダウンロードし、ダウンロードに失敗した場合のみ、まだgit管理
      # 下に残っている可能性のある.gz(移行期のフォールバック)を使う。どちらも
      # 無ければ(このワークフローだけは)次の"Build candidates when needed"の
      # ゼロからの再生成フォールバックに委ねる(このワークフローの既存の
      # 再生成フォールバックを壊さないよう、ここではジョブを失敗させない)。
      # ゲート条件・探索範囲・検証ロジックは変更していない。
      - name: Materialize candidates CSV from release or compressed git storage
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            GZ_FROM_GIT=0
            [ -f walk_forward_all_candidates.csv.gz ] && GZ_FROM_GIT=1
            DOWNLOADED=0
            for i in 1 2 3; do
              if curl -fL -o walk_forward_all_candidates.csv.gz.tmp \
                "https://github.com/aifuu/stock-ai/releases/download/walk-forward-candidates-latest/walk_forward_all_candidates.csv.gz"; then
                mv -f walk_forward_all_candidates.csv.gz.tmp walk_forward_all_candidates.csv.gz
                DOWNLOADED=1
                break
              fi
              rm -f walk_forward_all_candidates.csv.gz.tmp
              echo "⚠️ release資産のダウンロード失敗 (試行${i}/3)"
              sleep $((i * 5))
            done
            if [ "$DOWNLOADED" != "1" ] && [ "$GZ_FROM_GIT" = "1" ]; then
              echo '⚠️ releaseダウンロードに失敗したため、git管理下の.gz(移行期のフォールバック)を使用します'
            fi
            if [ -f walk_forward_all_candidates.csv.gz ]; then
              gunzip -k walk_forward_all_candidates.csv.gz
            else
              echo '⚠️ walk_forward_all_candidates.csv.gzが見つかりません。次のBuild candidates when neededでゼロから再生成します。'
            fi
          fi

      - name: Build candidates when needed
        run: |
          if [ ! -s walk_forward_all_candidates.csv ]; then
            python daily_model_retrain.py
            python walk_forward.py
          fi
          test -s walk_forward_all_candidates.csv

      - name: Run 4 independent OOS profit gate (trend-filtered)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python multi_oos_profit_gate.py

      # ★変更(PLAN B, 2026-09): validateジョブと同じ理由でcandidates/配下のみに
      # 書く。strategy_policy_up.json / strategy_policy_down.jsonといったライブ
      # ファイルはこのジョブからは一切書き込まれない。
      - name: Build trend-specific policy (candidate only — live policy files are never written)
        env:
          BSP_INPUT_FILE: adversarial_final_candidates_${{ matrix.trend }}.csv
          BSP_POLICY_FILE: candidates/candidate_strategy_policy_${{ matrix.trend }}.json
        run: |
          mkdir -p candidates
          python build_strategy_policy.py

      - name: Show selected trend policy (candidate)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('candidates/candidate_strategy_policy_${{ matrix.trend }}.json')
          if not path.exists():
              print('candidateファイル未生成(Final PASS 0件、または最低保持期間中で現行candidateを維持)')
          else:
              with open(path, encoding='utf-8') as f:
                  p = json.load(f)
              print('===== TREND=${{ matrix.trend }} POLICY (CANDIDATE — 未昇格/未本番反映) =====')
              print('status:', p.get('status'))
              print('strategy:', p.get('strategy_name'))
              print('monthly positive:', p.get('oos_monthly_positive_ratio'), '%')
              print('OOS compound:', p.get('oos_compound_return'), '%')
              print('PF:', p.get('oos_pf'))
              print('max DD:', p.get('oos_dd'), '%')
          PY

      # 純粋な読み取り専用比較(JSONを読むだけ)。up/downは並列実行される別
      # matrixジョブなので、up/downそれぞれ専用の比較ファイル名にして
      # 互いの出力を上書きしないようにする(latest_comparison_up.md /
      # latest_comparison_down.md)。ライブ側のstrategy_policy_down.jsonは
      # まだ存在しない場合があり、その場合も例外を出さず「LIVEファイルなし」
      # として扱う。
      - name: Compare trend candidate vs live policy (read-only, no signature ops)
        env:
          CMP_CANDIDATE_FILE: candidates/candidate_strategy_policy_${{ matrix.trend }}.json
          CMP_LIVE_FILE: strategy_policy_${{ matrix.trend }}.json
          CMP_LABEL: 'trend=${{ matrix.trend }} (strategy_policy_${{ matrix.trend }}.json)'
          CMP_OUT_FILE: candidates/latest_comparison_${{ matrix.trend }}.md
        run: |
          mkdir -p candidates
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          CANDIDATE = os.environ['CMP_CANDIDATE_FILE']
          LIVE = os.environ['CMP_LIVE_FILE']
          LABEL = os.environ['CMP_LABEL']
          OUT_MD = os.environ['CMP_OUT_FILE']

          CORE_FIELDS = [
              'up_threshold', 'min_score_for_buy', 'nikkei_filter',
              'atr_tp_multiplier', 'atr_sl_multiplier', 'hold_days', 'strategy_name',
          ]

          def load(path):
              p = Path(path)
              if not p.exists() or p.stat().st_size == 0:
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'⚠ {path} 読み込み失敗: {e}')
                  return None

          def row(label, policy, note=''):
              if policy is None:
                  return f"| {label} | - | - | - | - | - | - | - | - | - | - | - | - | - | {note} |"
              return (
                  f"| {label} "
                  f"| {policy.get('strategy_name','')} "
                  f"| {policy.get('up_threshold','')} "
                  f"| {policy.get('min_score_for_buy','')} "
                  f"| {policy.get('nikkei_filter','')} "
                  f"| {policy.get('atr_tp_multiplier','')} "
                  f"| {policy.get('atr_sl_multiplier','')} "
                  f"| {policy.get('hold_days','')} "
                  f"| {policy.get('validation_pf','')} "
                  f"| {policy.get('oos_pf','')} "
                  f"| {policy.get('oos_dd','')} "
                  f"| {policy.get('oos_avg_month_return','')} "
                  f"| {policy.get('oos_signals','')} "
                  f"| {policy.get('status','')} ({policy.get('updated_at','')}) "
                  f"| {note} |"
              )

          candidate = load(CANDIDATE)
          live = load(LIVE)

          header = (
              "| kind | strategy_name | up_threshold | min_score_for_buy | nikkei_filter | "
              "TP | SL | hold_days | validation_pf | oos_pf | oos_dd | oos_avg_month_return | "
              "oos_signals | status(updated_at) | note |\n"
              "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"
          )

          lines = [f"# Candidate vs Live Policy Comparison — {LABEL}", "", header]
          lines.append(row('LIVE', live, '' if live is not None else 'ファイルなし'))
          lines.append(row('CANDIDATE', candidate, '' if candidate is not None else 'ファイルなし(未生成)'))
          lines.append('')

          if candidate is None:
              verdict = 'DIFFERENT'
              lines.append(f'判定: {verdict} — candidateファイルが存在しません(今回PASS候補なし、または保持期間中で更新なし)')
          elif live is None:
              verdict = 'DIFFERENT'
              lines.append(f'判定: {verdict} — LIVEファイルが存在しません(比較対象なし)')
          else:
              same_core = all(candidate.get(k) == live.get(k) for k in CORE_FIELDS)
              verdict = 'SAME' if same_core else 'DIFFERENT'
              lines.append(f'判定: {verdict}')

          lines.append('')
          lines.append('LIVE FILES UNCHANGED')
          lines.append('')

          out_text = '\n'.join(lines) + '\n'
          Path(OUT_MD).write_text(out_text, encoding='utf-8')
          print(out_text)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(out_text)
          PY

      - name: 'Guard: live policy files must stay untouched'
        run: |
          CHANGED=$(git status --porcelain -- strategy_policy.json strategy_policy_up.json strategy_policy_down.json policy_manual_overrides.json)
          if [ -n "$CHANGED" ]; then
            echo '❌ 安全ガード: ライブpolicyファイルへの変更を検出したため中断します'
            echo "$CHANGED"
            exit 1
          fi
          echo '✅ ライブpolicyファイルは変更されていません(strategy_policy.json / strategy_policy_up.json / strategy_policy_down.json / policy_manual_overrides.json)'

      - name: Commit trend-specific optimizer outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # candidates/candidate_strategy_policy_${{ matrix.trend }}.json は
          # 「今回Final PASS 0件」等で生成されないことがあるため、他のCSV群と
          # 同じgit addにまとめない(理由はvalidateジョブのコメントと同じ)。
          git add candidates/candidate_strategy_policy_${{ matrix.trend }}.json 2>/dev/null || true
          git add candidates/latest_comparison_${{ matrix.trend }}.md 2>/dev/null || true
          git add adversarial_final_candidates_${{ matrix.trend }}.csv adversarial_validation_results_${{ matrix.trend }}.csv adversarial_oos_results_${{ matrix.trend }}.csv multi_oos_folds_${{ matrix.trend }}.csv multi_oos_fold_funnel_${{ matrix.trend }}.csv multi_oos_results_${{ matrix.trend }}/ 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m "chore: update trend=${{ matrix.trend }} policy outputs [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ trend=${{ matrix.trend }} outputs pushed'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ push failed'
          exit 1

      - name: Upload trend-specific artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profit-optimizer-trend-${{ matrix.trend }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            adversarial_final_candidates_${{ matrix.trend }}.csv
            adversarial_validation_results_${{ matrix.trend }}.csv
            adversarial_oos_results_${{ matrix.trend }}.csv
            multi_oos_folds_${{ matrix.trend }}.csv
            multi_oos_results_${{ matrix.trend }}/**
            multi_oos_fold_funnel_${{ matrix.trend }}.csv
            candidates/candidate_strategy_policy_${{ matrix.trend }}.json
            candidates/latest_comparison_${{ matrix.trend }}.md
