name: AI Profit Optimizer - Regime TOP1 4 Fold OOS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 6'

permissions:
  contents: write

concurrency:
  group: stock-ai-profit-optimizer
  cancel-in-progress: false

env:
  WF_TOP_N: '1'
  WF_OOS_FOLDS: '4'
  WF_OOS_DAYS: '252'
  WF_INITIAL_CAPITAL: '1000000'
  WF_PURGE_DAYS: '7'
  WF_EMBARGO_DAYS: '7'
  WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
  WF_MAX_OOS_DD: '35'
  WF_MIN_POSITIVE_FOLDS: '3'
  WF_MIN_TOTAL_OOS_TRADES: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: |
          python -m py_compile regime_profit_core.py
          python -m py_compile enrich_walk_forward_candidates.py
          python -m py_compile daily_model_retrain.py
          python -m py_compile walk_forward.py
          python -m py_compile multi_oos_profit_validator.py
          python -m py_compile build_verified_profit_policy.py
          python -m py_compile run_profit_loop.py
          python -m py_compile profit_top10_paper.py

      - name: Check policy signing secret
        run: |
          test -n "$AI_POLICY_SIGNING_SECRET" || { echo '❌ AI_POLICY_SIGNING_SECRET 未設定'; exit 1; }
          echo '✅ policy signing secret configured'

      - name: Build model and walk-forward candidates
        run: |
          python daily_model_retrain.py
          python walk_forward.py
          test -s walk_forward_all_candidates.csv
          python enrich_walk_forward_candidates.py
          test -s walk_forward_all_candidates.csv

      - name: Run identical 4-fold regime TOP1 OOS validation
        run: |
          python multi_oos_profit_validator.py
          test -e adversarial_final_candidates.csv

      - name: Build signed verified policy
        run: |
          python build_verified_profit_policy.py
          test -s strategy_policy.json

      - name: Verify policy signature and selection mode
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os
          from pathlib import Path
          p = json.loads(Path('strategy_policy.json').read_text(encoding='utf-8'))
          if str(p.get('status','')).upper() != 'APPROVED':
              raise SystemExit(f"policy status={p.get('status')} -> paper trade remains stopped")
          if p.get('selection_mode') != 'REGIME_EXPECTED_RETURN_TOP1':
              raise SystemExit('❌ selection_mode mismatch')
          if p.get('source') != 'adversarial_strategy_validator':
              raise SystemExit('❌ policy source mismatch')
          if p.get('selection_version') != 'regime_profit_core_v1':
              raise SystemExit('❌ selection version mismatch')
          keys = [
              'status','updated_at','up_threshold','min_score_for_buy','nikkei_filter',
              'atr_tp_multiplier','atr_sl_multiplier','hold_days','validation_signals',
              'validation_win_rate','validation_avg_return','validation_pf','validation_dd',
              'oos_signals','oos_win_rate','oos_avg_return','oos_pf','oos_dd',
              'oos_validation_pf_ratio','mc_sizing','mc_10y_probability','mc_15y_probability',
              'mc_20y_probability','mc_bankruptcy_probability','mc_p90_max_dd',
              'strategy_name','selection_mode','regime_expectancy_json','source'
          ]
          payload = json.dumps({k:p.get(k) for k in keys}, ensure_ascii=False, sort_keys=True, separators=(',',':'))
          expected = hmac.new(os.environ['AI_POLICY_SIGNING_SECRET'].encode(), payload.encode(), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(str(p.get('approval_signature','')), expected):
              raise SystemExit('❌ policy signature mismatch')
          print('✅ signed policy verified')
          print('✅ selection_mode:', p['selection_mode'])
          print('✅ OOS compound:', p.get('oos_compound_return'))
          print('✅ monthly positive:', p.get('oos_monthly_positive_ratio'))
          print('✅ expected value:', p.get('oos_expected_value'))
          PY

      - name: Run TOP1 paper loop with exact OOS ranking
        run: |
          python run_profit_loop.py

      - name: Persist validated outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regime_profit_core.py enrich_walk_forward_candidates.py multi_oos_profit_validator.py build_verified_profit_policy.py run_profit_loop.py .github/workflows/profit-optimizer-validation.yml walk_forward_all_candidates.csv adversarial_final_candidates.csv adversarial_multi_oos_folds.csv adversarial_oos_results.csv strategy_policy.json profit_top10_paper_state.json profit_top10_paper_history.csv profit_top10_monthly_performance.csv 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo 'ℹ️ 変更なし'
            exit 0
          fi
          git commit -m 'fix: unify regime expected return OOS and TOP1 runtime'
          git push origin HEAD
