name: All Candidates Paper Trading (Research Track)

# 独立6ヶ月データ収集トラック。profit_top10_paper.py(TOP1のみ取引するlive)
# とは完全に別のGitHub Releaseタグ/git管理ファイルにのみ書き込み、liveの
# state/history/policyファイルには一切触れない。5分ループのliveと違い、
# 決済判定は「日足の遡りチェック + 当日イントラデイ + HOLD_LIMIT」で完結する
# ため、1日1回(大引け前)の実行で十分。
on:
  workflow_dispatch: {}
  schedule:
    # JST 15:20 (UTC 06:20)。15:20 JSTは同日のUTC 06:20(日付またぎ無し)なので
    # 曜日指定はUTC/JSTどちらでも月〜金でよい。
    - cron: '20 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-ai-all-candidates-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check
        run: python -m py_compile all_candidates_paper.py

      - name: Run all-candidates paper trading research track
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python all_candidates_paper.py

      - name: Commit updated aggregate summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stage_and_commit() {
            git add all_candidates_daily_summary.csv all_candidates_monthly_summary.csv 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -m 'chore: update all-candidates paper trading research summaries [skip ci]'
          }
          stage_and_commit
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ all-candidates summary push成功'
              exit 0
            fi
            git rebase --abort || true
            git reset origin/main
            stage_and_commit
            sleep $((i * 3))
          done
          echo '❌ all-candidates summary push失敗'
          exit 1
