name: TOP10 Ticker Performance Report

on:
  # JST 07:45（UTC 22:45、月〜金）: daily-model-retrain.yml(JST 07:30)の直後に実行。
  # UTC 22:45+9h=JST翌日07:45のため、UTC曜日は月〜金(1-5)ではなく日〜木(0-4)を
  # 指定する必要がある。1-5のままだとJST火〜土に発火し、月曜は発火せず土曜に
  # 不要発火する(daily-model-retrain.ymlと同種のバグ、同じ形で修正)。
  schedule:
    - cron: '45 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Syntax check
        run: python -m py_compile top10_ticker_performance_report.py

      - name: Run TOP10 ticker performance report
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TICKER_PERF_LOOKBACK_DAYS: '30'
        run: python top10_ticker_performance_report.py

      - name: Commit ticker performance report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add top10_ticker_performance.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Update TOP10 ticker performance report'
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ ticker performance report push成功'
              PUSH_OK=1
              break
            fi
            git rebase --abort || true
            sleep $((i*3))
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo '❌ ticker performance report push失敗'
            exit 1
          fi
