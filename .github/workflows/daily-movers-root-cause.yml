name: Daily Movers Root Cause Analysis

on:
  # JST 16:00（UTC 07:00）: 日中取引終了後に、その日の値動きを分析
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Run daily movers root-cause analysis
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAILY_MOVERS_TOP_N: '10'
          DAILY_MOVERS_MIN_AVG_VOLUME: '300000'
        run: python daily_movers_root_cause.py

      - name: Syntax check
        run: python -m py_compile daily_movers_root_cause.py nikkei225_sectors.py

      - name: Commit daily analysis history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily_movers_root_cause.csv 2>/dev/null || true
          git add daily_movers_root_cause_history.csv 2>/dev/null || true
          git add daily_sector_performance.csv 2>/dev/null || true
          git add daily_sector_performance_history.csv 2>/dev/null || true
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'Update daily movers root-cause analysis'
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ daily movers root-cause push成功'
              PUSH_OK=1
              break
            fi
            git rebase --abort || true
            sleep $((i*3))
          done
          if [ "$PUSH_OK" -ne 1 ]; then
            echo '❌ daily movers root-cause push失敗'
            exit 1
          fi