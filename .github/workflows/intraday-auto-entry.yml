name: 毎日TOP3 5分足 自動エントリー監視

on:
  schedule:
    # JST 09:15〜10:00 = UTC 00:15〜01:00、平日のみ
    - cron: '15-55/5 0 * * 1-5'
    - cron: '0 1 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-auto-entry
  cancel-in-progress: false

jobs:
  auto-entry-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest default branch
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests jpholiday

      - name: Show active intraday policy
        run: |
          echo '===== ACTIVE INTRADAY POLICY ====='
          if [ -f strategy_policy.json ]; then
            python - <<'PY'
            import json
            with open('strategy_policy.json', encoding='utf-8') as f:
                p = json.load(f)
            for k in [
                'intraday_strategy','intraday_min_score','intraday_min_up_prob',
                'intraday_min_vol_ratio','intraday_atr_tp','intraday_atr_sl',
                'intraday_trades','intraday_pf','intraday_win_rate',
                'intraday_avg_return_pct'
            ]:
                if k in p:
                    print(f'{k}: {p[k]}')
            PY
          else
            echo '⚠ strategy_policy.jsonなし → スクリプト内フォールバック設定を使用'
          fi

      - name: Run entry monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TOP3_HISTORY_FILE: prediction_history.csv
          AUTO_ENTRY_ATR_TP: '2.0'
          AUTO_ENTRY_ATR_SL: '1.0'
          AUTO_ENTRY_MAX_GAP: '5.0'
        run: python intraday_auto_entry_monitor.py

      - name: Persist daily entry state safely
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intraday_auto_entry_state.json paper_intraday_history.csv 2>/dev/null || true
          git add -u
          git commit -m 'chore: persist intraday auto entry state' || echo '状態変更なし'
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo '❌ entry state rebase conflict'
              exit 1
            }
            if git push origin HEAD:main; then
              echo '✅ entry state push成功'
              exit 0
            fi
            echo "⚠️ entry state push競合、再試行: $i/5"
            sleep $((i * 3))
          done
          echo '❌ entry state push失敗'
          exit 1
