name: 毎日TOP3 5分足 3段階自動エントリー監視

on:
  workflow_run:
    workflows: ["AI Stock Scan + Auto Strategy Validation"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-entry-monitor:
    # AI Stock Scan + Auto Strategy Validation が成功した日だけ自動起動。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests jpholiday

      - name: Wait until JST 09:15
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          jst = ZoneInfo('Asia/Tokyo')
          while True:
              now = datetime.now(jst)
              target = now.replace(hour=9, minute=15, second=0, microsecond=0)
              if now >= target:
                  break
              seconds = max(1, int((target - now).total_seconds()))
              print(f'現在JST={now:%Y-%m-%d %H:%M:%S} / 9:15まで約{seconds}秒')
              time.sleep(min(seconds, 60))
          PY

      - name: Monitor every 5 minutes from JST 09:15 to 10:00
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TOP3_HISTORY_FILE: prediction_history.csv
          AUTO_ENTRY_ATR_TP: '2.0'
          AUTO_ENTRY_ATR_SL: '1.0'
          AUTO_ENTRY_MAX_GAP: '5.0'
        run: |
          python - <<'PY'
          import subprocess
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          jst = ZoneInfo('Asia/Tokyo')
          last_date = None
          while True:
              now = datetime.now(jst)
              if now.time().hour > 10 or (now.time().hour == 10 and now.time().minute > 5):
                  print('10:05を過ぎたため監視終了')
                  break

              print(f'===== auto entry check {now:%Y-%m-%d %H:%M:%S} JST =====')
              subprocess.run(['python', 'intraday_auto_entry_monitor.py'], check=False)

              # 1日に1回シグナルが出た場合は次のループでもスクリプト側で停止。
              time.sleep(300)
          PY

      - name: Persist daily signal state
        if: always()
        run: |
          if [ -f intraday_auto_entry_state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add intraday_auto_entry_state.json
            if git diff --cached --quiet; then
              echo '状態変更なし'
            else
              git commit -m 'chore: persist intraday auto entry state' || true
              git push || true
            fi
          fi
