name: One-time repair TOP1 syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stock-ai-main-writer
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair TOP1 trader syntax before execution'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('daily_directional_top1.py')
          s = p.read_text(encoding='utf-8')
          bad = 'state["max_dd"]=max(state.get("max_dd",0),((state["peak"]-state["capital"])/state["peak"]*100 if state["peak"] else 0); append_history'
          good = 'state["max_dd"]=max(state.get("max_dd",0),((state["peak"]-state["capital"])/state["peak"]*100 if state["peak"] else 0)); append_history'
          if bad in s:
              p.write_text(s.replace(bad, good, 1), encoding='utf-8')
              print('✅ repaired')
          else:
              print('ℹ️ no known corruption')
          PY
          python -m py_compile daily_directional_top1.py
          python -m py_compile intraday_directional_top1_cycle.py

      - name: Commit repaired source and remove one-time workflow
        run: |
          set -e
          rm -f .github/workflows/repair-top1-syntax.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily_directional_top1.py .github/workflows/repair-top1-syntax.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair daily TOP1 syntax [skip ci]'
          git push origin HEAD:main
