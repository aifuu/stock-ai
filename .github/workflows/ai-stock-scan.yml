name: AI Stock Scan - Profit Loop TOP10 Paper Trade

on:
  schedule:
    - cron: '30 23 * * 1-5'
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# Paper trading state is valuable only if every run can see the previous run.
# Do not cancel an active ledger-writing run; persistence has priority over freshness.
concurrency:
  group: stock-ai-paper-trading
  cancel-in-progress: false

jobs:
  profit-loop-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Apply expanded stock universe
        run: |
          python apply_expanded_universe.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          vals=[]
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
          print(f'✅ Expanded runtime universe = {len(vals)}銘柄')
          if len(vals) < 250: raise SystemExit('❌ 拡張ユニバースが250未満')
          PY

      - name: Syntax check
        run: |
          python -m py_compile expanded_universe.py apply_expanded_universe.py intraday_scheduler.py run_profit_loop.py paper_fast_entrypoint.py paper_profit_entrypoint.py paper_risk_policy.py daily_model_retrain.py walk_forward.py adversarial_strategy_validator.py adversarial_oos_diagnostic.py multi_oos_profit_validator.py build_verified_profit_policy.py daily_directional_top1.py profit_top10_paper.py intraday_directional_top1_cycle.py multi_hold_paper.py multi_hold_monthly_performance.py

      - name: Verify expanded tickers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files=['daily_directional_top1.py','walk_forward.py','stock_scan.py']
          counts=[]
          for f in files:
              tree=ast.parse(Path(f).read_text(encoding='utf-8')); vals=[]
              for node in tree.body:
                  if isinstance(node,ast.Assign):
                      for target in node.targets:
                          if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
              if len(vals)<250 or len(vals)!=len(set(vals)): raise SystemExit(f'❌ {f}: {len(vals)}銘柄/重複あり')
              counts.append(len(vals)); print(f'✅ {f}: {len(vals)}銘柄・重複なし')
          if len(set(counts))!=1: raise SystemExit(f'❌ 3ファイルの銘柄数不一致: {counts}')
          PY

      - name: Record current scheduler phase
        run: python intraday_scheduler.py --phase auto

      - name: Morning premarket phase marker
        if: github.event_name == 'schedule' && github.event.schedule == '30 23 * * 1-5'
        run: python intraday_scheduler.py --phase premarket

      - name: Verify paper policy mode
        run: |
          test -s strategy_policy.json
          python - <<'PY'
          import json
          p=json.load(open('strategy_policy.json',encoding='utf-8'))
          status=str(p.get('status','')).upper()
          if status not in ('APPROVED','PENDING'):
              raise SystemExit(f'❌ 不正なpolicy status: {status}')
          print(f'✅ paper policy mode = {status}')
          if status == 'PENDING':
              print('⚠️ PENDINGでも紙取引は継続。実注文には使用しません。')
          PY

      - name: Pre-09:30 analysis/re-score (paper-only, NO TRADE)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          AI_INITIAL_CAPITAL: '1000000'
          INTRADAY_FEE_RATE: '0.00055'
          AI_DAILY_STOP_LOSS: '0.015'
          AI_MAX_DRAWDOWN: '0.30'
          AI_MAX_POSITIONS: '10'
          MAX_TRADES_PER_DAY: '30'
          MAX_TRADES_PER_TICKER_PER_DAY: '10'
          SAME_TICKER_COOLDOWN_MINUTES: '30'
          PAPER_TRADE_MODE: '1'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          minutes = now.hour * 60 + now.minute
          if minutes < 570:
              print(f'▶ 09:30前: 分析・TOP10再評価のみ実行 {now:%H:%M JST}')
              subprocess.run(['python', 'paper_fast_entrypoint.py', '--analysis-only'], check=True)
          else:
              print(f'⏭ 09:30以降: pre-09:30分析フェーズをスキップ {now:%H:%M JST}')
          PY

      - name: Run unified Profit Loop TOP10 (paper-only, 09:30 onward)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          AI_INITIAL_CAPITAL: '1000000'
          INTRADAY_FEE_RATE: '0.00055'
          AI_DAILY_STOP_LOSS: '0.015'
          AI_MAX_DRAWDOWN: '0.30'
          AI_MAX_POSITIONS: '10'
          MAX_TRADES_PER_DAY: '30'
          MAX_TRADES_PER_TICKER_PER_DAY: '10'
          SAME_TICKER_COOLDOWN_MINUTES: '30'
          PAPER_TRADE_MODE: '1'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          minutes = now.hour * 60 + now.minute
          if minutes < 570:
              print(f'⏸ 09:30前のためペーパートレード開始を待機: {now:%H:%M JST}')
              raise SystemExit(0)
          if minutes >= 930:
              print(f'⏸ 市場終了後のためペーパートレードを実行しません: {now:%H:%M JST}')
              raise SystemExit(0)
          print(f'▶ 09:30以降: FAST Profit Loop TOP10を実行 {now:%H:%M JST}')
          PY
          python paper_fast_entrypoint.py

      - name: Verify TOP10 paper state
        if: github.event_name != 'schedule' || github.event.schedule != '30 23 * * 1-5'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          if now.hour * 60 + now.minute < 570:
              print(f'⏸ 09:30前なのでstate検証をスキップ: {now:%H:%M JST}')
              raise SystemExit(0)
          import json
          from pathlib import Path
          p=Path('profit_top10_paper_state.json')
          if not p.exists(): raise SystemExit('❌ 09:30以降なのにpaper stateがありません')
          s=json.loads(p.read_text(encoding='utf-8')); positions=s.get('positions',[])
          if len(positions)>10: raise SystemExit(f'❌ TOP10超過: {len(positions)}')
          if int(s.get('trades_today',0))>30: raise SystemExit(f'❌ 1日30回超過: {s.get("trades_today")}')
          print(f'✅ 仮想資産: {float(s.get("capital",0)):,.0f}円')
          print(f'✅ 最大DD: {float(s.get("max_dd",0)):.2f}%')
          print(f'✅ 保有ポジション: {len(positions)}/10')
          print(f'✅ 本日新規: {int(s.get("trades_today",0))}/30')
          PY

      - name: Verify multi-hold paper state
        if: github.event_name != 'schedule' || github.event.schedule != '30 23 * * 1-5'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Tokyo'))
          if now.hour * 60 + now.minute < 570:
              print(f'⏸ 09:30前なのでmulti-hold state検証をスキップ: {now:%H:%M JST}')
              raise SystemExit(0)
          import json
          from pathlib import Path
          p=Path('multi_hold_paper_state.json')
          if not p.exists(): raise SystemExit('❌ 09:30以降なのにmulti-hold stateがありません')
          s=json.loads(p.read_text(encoding='utf-8'))
          positions=s.get('positions',[])
          if len(positions)>3: raise SystemExit(f'❌ 保有バケット超過: {len(positions)}')
          tickers={x.get('ticker') for x in positions}
          if len(tickers)>1: raise SystemExit(f'❌ 同一銘柄ルール違反: {tickers}')
          holds={x.get('hold_days') for x in positions}
          if not holds.issubset({1,3,5}): raise SystemExit(f'❌ 保有日数不正: {holds}')
          capitals=s.get('capitals',{})
          print(f"✅ 1日資産: {float(capitals.get('1',0)):,.0f}円")
          print(f"✅ 3日資産: {float(capitals.get('3',0)):,.0f}円")
          print(f"✅ 5日資産: {float(capitals.get('5',0)):,.0f}円")
          print(f'✅ 保有バケット: {len(positions)}/3')
          PY

      - name: Update multi-hold monthly performance
        if: always()
        run: python multi_hold_monthly_performance.py

      - name: Save paper ledger
        id: ledger_save
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in profit_top10_paper_state.json profit_top10_paper_history.csv profit_top10_monthly_performance.csv intraday_scheduler_state.json multi_hold_paper_state.json multi_hold_paper_history.csv multi_hold_monthly_performance.csv; do
            if [ -f "$f" ]; then git add "$f"; echo "✅ ledger add: $f"; else echo "ℹ️ ledger skip: $f"; fi
          done
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: persist intraday paper trading state [skip ci]'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push paper ledger
        if: steps.ledger_save.outputs.changed == 'true'
        run: |
          set -e
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase --autostash origin/main && git push origin HEAD:main; then
              echo '✅ paper ledger push成功'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ paper ledger push失敗'
          exit 1

      - name: Upload paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-loop-top10-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            strategy_policy.json
            profit_top10_paper_state.json
            profit_top10_paper_history.csv
            profit_top10_monthly_performance.csv
            intraday_scheduler_state.json
            multi_hold_paper_state.json
            multi_hold_paper_history.csv
            multi_hold_monthly_performance.csv
            daily_retrain_report.csv
            trade_feedback_report.csv
