name: AI Stock Scan + Auto Strategy Validation

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests scikit-learn joblib

      - name: Sync 100 ticker universe
        run: |
          python sync_ticker_universe.py

      - name: Verify 100 ticker universe
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def read_tickers(path):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "TICKERS":
                              return ast.literal_eval(node.value)
              raise RuntimeError(f"{path}: TICKERSが見つかりません")

          stock_tickers = read_tickers("stock_scan.py")
          wf_tickers = read_tickers("walk_forward.py")

          print("stock_scan.py 銘柄数  =", len(stock_tickers))
          print("walk_forward.py 銘柄数=", len(wf_tickers))

          if len(stock_tickers) != 100:
              raise SystemExit(f"❌ stock_scan.py が100銘柄ではありません: {len(stock_tickers)}")
          if len(wf_tickers) != 100:
              raise SystemExit(f"❌ walk_forward.py が100銘柄ではありません: {len(wf_tickers)}")
          if stock_tickers != wf_tickers:
              raise SystemExit("❌ stock_scan.py と walk_forward.py のTICKERSが一致していません")
          if len(set(stock_tickers)) != 100:
              raise SystemExit("❌ 重複銘柄があります")

          print("✅ 100銘柄・重複なし・2ファイル完全一致")
          PY

      - name: Python syntax check
        run: |
          python -m py_compile sync_ticker_universe.py
          python -m py_compile walk_forward.py
          python -m py_compile walk_forward_fast_runner.py
          python -m py_compile adversarial_strategy_validator.py
          python -m py_compile build_strategy_policy.py
          python -m py_compile stock_scan.py
          python -m py_compile discord_pretty_runner.py

      - name: Run Walk Forward (fast)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WF_REFIT_EVERY_TRADING_DAYS: '40'
          WF_N_ESTIMATORS: '150'
          WF_MAX_TRAIN_ROWS_PER_TICKER: '750'
        run: |
          python walk_forward_fast_runner.py

      - name: Check Walk Forward candidates
        run: |
          echo "===== FILE CHECK ====="
          ls -lh walk_forward_all_candidates.csv
          python - <<'PY'
          import os
          import pandas as pd
          file = "walk_forward_all_candidates.csv"
          if not os.path.exists(file):
              raise SystemExit("❌ walk_forward_all_candidates.csv がありません")
          df = pd.read_csv(file)
          print(f"✅ 全候補CSV確認: {len(df)} rows")
          if len(df) == 0:
              raise SystemExit("❌ walk_forward_all_candidates.csv が0件です")
          PY

      - name: Run Adversarial Validation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python adversarial_strategy_validator.py

      - name: Build strategy policy
        run: |
          python build_strategy_policy.py

      - name: Check strategy policy
        run: |
          echo "===== strategy_policy.json ====="
          if [ -f strategy_policy.json ]; then
            cat strategy_policy.json
          else
            echo "⚠ strategy_policy.json がありません"
          fi

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strategy-research-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            walk_forward_results.csv
            walk_forward_all_candidates.csv
            walk_forward_strategy_comparison.csv
            walk_forward_strategy_details.csv
            walk_forward_strategy_phase_comparison.csv
            walk_forward_monthly.csv
            walk_forward_yearly.csv
            adversarial_dev_all_results.csv
            adversarial_dev_selected_candidates.csv
            adversarial_validation_gate.csv
            adversarial_sensitivity.csv
            adversarial_oos_gate.csv
            adversarial_monte_carlo.csv
            adversarial_selected_sizing.csv
            adversarial_final_candidates.csv
            paper_trade_candidates.csv
            adversarial_monitoring_config.csv
            strategy_policy.json
            feature_importances.csv
            walk_forward_fast_runner.py

      - name: Commit research results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add stock_scan.py || true
          git add walk_forward.py || true
          git add walk_forward_fast_runner.py || true
          git add discord_pretty_runner.py || true
          git add walk_forward_results.csv || true
          git add walk_forward_all_candidates.csv || true
          git add walk_forward_strategy_comparison.csv || true
          git add walk_forward_strategy_details.csv || true
          git add walk_forward_strategy_phase_comparison.csv || true
          git add walk_forward_monthly.csv || true
          git add walk_forward_yearly.csv || true
          git add adversarial_dev_all_results.csv || true
          git add adversarial_dev_selected_candidates.csv || true
          git add adversarial_validation_gate.csv || true
          git add adversarial_sensitivity.csv || true
          git add adversarial_oos_gate.csv || true
          git add adversarial_monte_carlo.csv || true
          git add adversarial_selected_sizing.csv || true
          git add adversarial_final_candidates.csv || true
          git add paper_trade_candidates.csv || true
          git add adversarial_monitoring_config.csv || true
          git add strategy_policy.json || true
          git add feature_importances.csv || true
          git add -u
          git commit -m "Update 100 ticker strategy validation" || echo "No research changes"
          PUSH_SUCCESS=false
          for i in 1 2 3; do
            if git push; then
              echo "✅ push成功"
              PUSH_SUCCESS=true
              break
            fi
            echo "⚠ push失敗、リモートの変更を取り込んで再試行 ($i/3)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "true" ]; then
            echo "❌ 3回ともgit pushに失敗しました"
            exit 1
          fi

  production:
    needs:
      - research
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest default branch
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          echo "===== DEFAULT BRANCH ====="
          echo "$DEFAULT_BRANCH"
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard "origin/$DEFAULT_BRANCH"
          echo "===== CURRENT COMMIT ====="
          git log -1 --oneline
          echo "===== ACTIVE POLICY ====="
          if [ -f strategy_policy.json ]; then
            cat strategy_policy.json
          else
            echo "⚠ strategy_policy.jsonなし"
          fi

      - name: Verify production ticker universe
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          def read_tickers(path):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id == "TICKERS":
                              return ast.literal_eval(node.value)
              raise RuntimeError(f"{path}: TICKERSが見つかりません")
          stock_tickers = read_tickers("stock_scan.py")
          print("本番銘柄数:", len(stock_tickers))
          if len(stock_tickers) != 100:
              raise SystemExit(f"❌ 本番stock_scan.pyが100銘柄ではありません: {len(stock_tickers)}")
          if len(set(stock_tickers)) != 100:
              raise SystemExit("❌ 本番銘柄リストに重複があります")
          print("✅ 本番100銘柄確認完了")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests scikit-learn joblib

      - name: Python syntax check
        run: |
          python -m py_compile stock_scan.py
          python -m py_compile discord_pretty_runner.py

      - name: Show active strategy policy
        run: |
          echo "======================================"
          echo "🤖 ACTIVE STRATEGY POLICY"
          echo "======================================"
          if [ -f strategy_policy.json ]; then
            cat strategy_policy.json
          else
            echo "⚠ strategy_policy.jsonなし"
            echo "stock_scan.pyのデフォルト設定を使用"
          fi

      - name: Run Stock Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python discord_pretty_runner.py

      - name: Check production files
        run: |
          echo "===== PRODUCTION FILES ====="
          ls -lh prediction_history.csv train_data.csv model.pkl feature_importances.csv 2>/dev/null || true

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            prediction_history.csv
            train_data.csv
            model.pkl
            feature_importances.csv
            strategy_policy.json

      - name: Commit production results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add prediction_history.csv || true
          git add train_data.csv || true
          git add model.pkl || true
          git add feature_importances.csv || true
          git add strategy_policy.json || true
          git commit -m "Update AI stock scan results" || echo "No production changes"
          PUSH_SUCCESS=false
          for i in 1 2 3; do
            if git push; then
              echo "✅ push成功"
              PUSH_SUCCESS=true
              break
            fi
            echo "⚠ push失敗、リモートの変更を取り込んで再試行 ($i/3)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          if [ "$PUSH_SUCCESS" != "true" ]; then
            echo "❌ 3回ともgit pushに失敗しました"
            exit 1
          fi
