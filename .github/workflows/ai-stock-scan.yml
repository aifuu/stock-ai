          from pathlib import Path
          tree=ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          vals=[]
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
          print(f'✅ Runtime universe = {len(vals)}銘柄')
          if len(vals) != 225: raise SystemExit('❌ 日経225ユニバースが225銘柄ではありません')
          PY

      - name: Syntax check
        run: |
          python -m py_compile nikkei225_universe.py apply_expanded_universe.py intraday_scheduler.py run_profit_loop.py paper_fast_entrypoint.py paper_profit_entrypoint.py paper_risk_policy.py daily_model_retrain.py walk_forward.py adversarial_strategy_validator.py adversarial_oos_diagnostic.py multi_oos_profit_validator.py build_verified_profit_policy.py daily_directional_top1.py profit_top10_paper.py profit_top10_monthly_performance.py intraday_directional_top1_cycle.py

      - name: Verify Nikkei 225 tickers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files=['daily_directional_top1.py','walk_forward.py','stock_scan.py']
