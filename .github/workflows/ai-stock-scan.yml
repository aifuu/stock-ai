name: AI Stock Scan - Profit Loop TOP10 Paper Trade

on:
  schedule:
    - cron: '20 0 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# ペーパートレードのstateはAM/PMセッション間・pushの間で維持する必要がある。
concurrency:
  group: stock-ai-paper-trading
  cancel-in-progress: false

jobs:
  session_am:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      SESSION: AM
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      # ★変更(2026-09): 以前はこの通知がユニバース検証・構文チェック・policy検証の
      # 後段にあったため、これらいずれかが失敗するとジョブ起動通知自体が届かず、
      # 「何時何分に起動したか」の監視目的を果たせなかった。checkout+依存インストール
      # 直後の最も早いタイミングに移動し、後続チェックの成否に関わらず必ず送信する。
      - name: Notify AM session start (Discord)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -c "import discord_progress; discord_progress.notify_start('AM')"

      - name: Apply Nikkei 225 stock universe
        run: |
          python apply_expanded_universe.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          vals=[]
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
          print(f'✅ Runtime universe = {len(vals)}銘柄')
          if len(vals) != 225: raise SystemExit('❌ 日経225ユニバースが225銘柄ではありません')
          PY

      - name: Syntax check
        run: |
          python -m py_compile nikkei225_universe.py apply_expanded_universe.py intraday_scheduler.py run_profit_loop.py paper_fast_entrypoint.py paper_profit_entrypoint.py paper_risk_policy.py daily_model_retrain.py walk_forward.py adversarial_strategy_validator.py adversarial_oos_diagnostic.py multi_oos_profit_validator.py build_verified_profit_policy.py daily_directional_top1.py profit_top10_paper.py profit_top10_monthly_performance.py intraday_directional_top1_cycle.py

      - name: Verify Nikkei 225 tickers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files=['daily_directional_top1.py','walk_forward.py','stock_scan.py']
          counts=[]
          for f in files:
              tree=ast.parse(Path(f).read_text(encoding='utf-8')); vals=[]
              for node in tree.body:
                  if isinstance(node,ast.Assign):
                      for target in node.targets:
                          if isinstance(target,ast.Name) and target.id=='TICKERS': vals=ast.literal_eval(node.value)
              if len(vals)!=225 or len(vals)!=len(set(vals)): raise SystemExit(f'❌ {f}: {len(vals)}銘柄/重複あり')
              counts.append(len(vals)); print(f'✅ {f}: {len(vals)}銘柄・重複なし')
          if len(set(counts))!=1: raise SystemExit(f'❌ 3ファイルの銘柄数不一致: {counts}')
          PY

      - name: Morning premarket phase marker
        run: python intraday_scheduler.py --phase premarket

      - name: Verify paper policy mode
        run: |
          test -s strategy_policy.json
          python - <<'PY'
          import json
          p=json.load(open('strategy_policy.json',encoding='utf-8'))
          status=str(p.get('status','')).upper()
          if status not in ('APPROVED','PENDING'):
              raise SystemExit(f'❌ 不正なpolicy status: {status}')
          print(f'✅ paper policy mode = {status}')
          if status == 'PENDING': print('⚠️ PENDINGでも紙取引は継続。実注文には使用しません。')
          PY

      - name: AM session loop (09:20-12:35 JST, 5分おきtick)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          AI_INITIAL_CAPITAL: '1000000'
          INTRADAY_FEE_RATE: '0.00055'
          AI_DAILY_STOP_LOSS: '0.015'
          AI_MAX_DRAWDOWN: '0.30'
          AI_MAX_POSITIONS: '10'
          MAX_TRADES_PER_DAY: '30'
          MAX_TRADES_PER_TICKER_PER_DAY: '10'
          SAME_TICKER_COOLDOWN_MINUTES: '30'
          PAPER_TRADE_MODE: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          case "$SESSION" in
            AM) SESSION_END_MIN=755 ;;
            PM) SESSION_END_MIN=935 ;;
            *) echo "❌ SESSION未設定"; exit 1 ;;
          esac

          START_EPOCH=$(date +%s)
          HARD_WALL_EPOCH=$((START_EPOCH + 320*60))
          FAIL_STREAK=0
          ITER=0

          while true; do
            ITER=$((ITER+1))
            NOW_EPOCH=$(date +%s)
            CUR_MIN=$(TZ=Asia/Tokyo date +%H:%M | awk -F: '{print $1*60+$2}')

            if [ "$CUR_MIN" -ge "$SESSION_END_MIN" ]; then
              echo "🏁 セッション終了時刻に到達 (JST分=$CUR_MIN >= $SESSION_END_MIN)"
              break
            fi
            if [ "$NOW_EPOCH" -ge "$HARD_WALL_EPOCH" ]; then
              echo "🏁 320分の上限に到達、セッションを終了します"
              break
            fi

            echo "▶ tick $(date -u +%H:%M:%S)Z JST分=$CUR_MIN iteration=$ITER SESSION=$SESSION"

            if (
            set -e
            rm -f scan_candidates_cache.json

            python intraday_scheduler.py --phase auto

            python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import subprocess
          now=datetime.now(ZoneInfo('Asia/Tokyo')); minutes=now.hour*60+now.minute
          if minutes < 570:
              print(f'▶ 09:30前: 分析・TOP10再評価のみ実行 {now:%H:%M JST}')
              subprocess.run(['python','paper_fast_entrypoint.py','--analysis-only'],check=True)
          else:
              print(f'⏭ 09:30以降: pre-09:30分析フェーズをスキップ {now:%H:%M JST}')
          PY

            python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Tokyo')); minutes=now.hour*60+now.minute
          if minutes < 570:
              print(f'⏸ 09:30前のためペーパートレード開始を待機: {now:%H:%M JST}')
              raise SystemExit(0)
          if minutes >= 930:
              print(f'⏸ 市場終了後のためペーパートレードを実行しません: {now:%H:%M JST}')
              raise SystemExit(0)
          print(f'▶ 09:30以降: FAST Profit Loop TOP10を実行 {now:%H:%M JST}')
          PY
            python paper_fast_entrypoint.py

            python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Asia/Tokyo'))
          if now.hour*60+now.minute < 570:
              print(f'⏸ 09:30前なのでstate検証をスキップ: {now:%H:%M JST}')
          else:
              import json
              from pathlib import Path
              p=Path('profit_top10_paper_state.json')
              if not p.exists(): raise SystemExit('❌ 09:30以降なのにpaper stateがありません')
              s=json.loads(p.read_text(encoding='utf-8')); positions=s.get('positions',[])
              if len(positions)>10: raise SystemExit(f'❌ TOP10超過: {len(positions)}')
              if int(s.get('trades_today',0))>30: raise SystemExit(f'❌ 1日30回超過: {s.get("trades_today")}')
              print(f'✅ 仮想資産: {float(s.get("capital",0)):,.0f}円')
              print(f'✅ 最大DD: {float(s.get("max_dd",0)):.2f}%')
              print(f'✅ 保有ポジション: {len(positions)}/10')
              print(f'✅ 本日新規: {int(s.get("trades_today",0))}/30')
          PY

            python profit_top10_monthly_performance.py

            for f in profit_top10_paper_state.json profit_top10_paper_history.csv profit_top10_monthly_performance.csv intraday_scheduler_state.json futures_trend_history.csv discord_progress_state.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done

            if ! git diff --cached --quiet; then
              git commit -m 'chore: persist intraday paper trading state [skip ci]'
              PUSH_OK=0
              for i in 1 2 3 4 5; do
                git fetch origin main
                if git rebase --autostash origin/main && git push origin HEAD:main; then
                  echo '✅ paper ledger push成功'
                  PUSH_OK=1
                  break
                fi
                git rebase --abort || true
                sleep $((i*3))
              done
              if [ "$PUSH_OK" -ne 1 ]; then
                echo '❌ paper ledger push失敗'
                exit 1
              fi
            else
              echo 'ℹ️ 変更なし、pushスキップ'
            fi
            ); then
              ITER_EXIT=0
            else
              ITER_EXIT=$?
            fi

            if [ "$ITER_EXIT" -eq 0 ]; then
              FAIL_STREAK=0
            else
              FAIL_STREAK=$((FAIL_STREAK+1))
              echo "⚠️ イテレーション失敗 (exit=$ITER_EXIT), 連続失敗=$FAIL_STREAK"
              if [ "$FAIL_STREAK" -ge 6 ]; then
                echo "❌ 連続6回(30分)失敗のためセッションを中断します"
                exit 1
              fi
            fi

            NOW_SEC=$(date +%s)
            REMAINDER=$((NOW_SEC % 300))
            SLEEP_SEC=$((300 - REMAINDER))
            if [ "$SLEEP_SEC" -ge 300 ]; then SLEEP_SEC=300; fi
            echo "💤 次のtickまで${SLEEP_SEC}秒sleep"
            sleep "$SLEEP_SEC"
          done

      - name: Upload paper artifacts (AM)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-loop-top10-am-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            strategy_policy.json
            profit_top10_paper_state.json
            profit_top10_paper_history.csv
            profit_top10_monthly_performance.csv
            intraday_scheduler_state.json
            daily_retrain_report.csv
            trade_feedback_report.csv

  session_pm:
    needs: [session_am]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      SESSION: PM
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      # ★変更(2026-09): AM側と同じ理由で、ユニバース検証・構文チェック・policy検証
      # より前の最も早いタイミングに移動(理由の詳細はAM側の同コメント参照)。
      - name: Notify PM session start (Discord)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python -c "import discord_progress; discord_progress.notify_start('PM')"

      - name: Apply Nikkei 225 stock universe
