          MAX_TRADES_PER_TICKER_PER_DAY: '10'
          SAME_TICKER_COOLDOWN_MINUTES: '30'
          PAPER_TRADE_MODE: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          case "$SESSION" in
            AM) SESSION_END_MIN=755 ;;
            PM) SESSION_END_MIN=935 ;;
            *) echo "❌ SESSION未設定"; exit 1 ;;
          esac

          START_EPOCH=$(date +%s)
          HARD_WALL_EPOCH=$((START_EPOCH + 320*60))
          FAIL_STREAK=0
          ITER=0

          while true; do
            ITER=$((ITER+1))
            NOW_EPOCH=$(date +%s)
            CUR_MIN=$(TZ=Asia/Tokyo date +%H:%M | awk -F: '{print $1*60+$2}')

            if [ "$CUR_MIN" -ge "$SESSION_END_MIN" ]; then
              echo "🏁 セッション終了時刻に到達 (JST分=$CUR_MIN >= $SESSION_END_MIN)"
              break
            fi
            if [ "$NOW_EPOCH" -ge "$HARD_WALL_EPOCH" ]; then
              echo "🏁 320分の上限に到達、セッションを終了します"
