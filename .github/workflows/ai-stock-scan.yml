name: AI Stock Scan - Profit Loop TOP10 Paper Trade

on:
  schedule:
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-ai-profit-loop
  cancel-in-progress: false

jobs:
  profit-loop-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday
      - name: Syntax check
        run: |
          python -m py_compile daily_model_retrain.py
          python -m py_compile walk_forward.py
          python -m py_compile adversarial_strategy_validator.py
          python -m py_compile adversarial_oos_diagnostic.py
          python -m py_compile build_strategy_policy.py
          python -m py_compile daily_directional_top1.py
          python -m py_compile profit_top10_paper.py
          python -m py_compile intraday_directional_top1_cycle.py
      - name: Verify 100 tickers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          tickers = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'TICKERS':
                          tickers = ast.literal_eval(node.value)
          if tickers is None or len(tickers) != 100 or len(set(tickers)) != 100:
              raise SystemExit(f'❌ 100銘柄ユニバース不正: {0 if tickers is None else len(tickers)}')
          print('✅ 100銘柄・重複なし')
          PY
      - name: Check required signing secret (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
        run: |
          test -n "$AI_POLICY_SIGNING_SECRET" || { echo '❌ AI_POLICY_SIGNING_SECRET が未設定。安全のためフルパイプラインを開始しません'; exit 1; }
          echo '✅ policy署名用Secret設定済み'
      - name: Align adversarial approval gates
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('adversarial_strategy_validator.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('OOS_DAYS = int(os.getenv("WF_OOS_DAYS", "90"))', 'OOS_DAYS = int(os.getenv("WF_OOS_DAYS", "252"))')
          s = s.replace('MIN_VALIDATION_TRADES = 30', 'MIN_VALIDATION_TRADES = 20')
          p.write_text(s, encoding='utf-8')
          p = Path('build_strategy_policy.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MIN_VALIDATION_TRADES = 50', 'MIN_VALIDATION_TRADES = 20')
          p.write_text(s, encoding='utf-8')
          print('✅ Validation最低件数: 20件に統一')
          print('✅ OOS: 252営業日')
          PY
      - name: Full validation pipeline (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          RETRAIN_HOLDOUT_DAYS: '90'
          RETRAIN_MIN_OOS_TRADES: '15'
          RETRAIN_MIN_OOS_PF: '1.0'
          RETRAIN_MAX_OOS_DD_PCT: '30.0'
          RETRAIN_MIN_ROWS: '3000'
          RETRAIN_DOWNLOAD_SLEEP: '0.15'
          WF_TOP_N: '10'
          WF_OOS_DAYS: '252'
          WF_N_ESTIMATORS: '100'
          WF_REFIT_EVERY_TRADING_DAYS: '40'
          WF_INITIAL_CAPITAL: '1000000'
          WF_MIN_MONTHLY_POSITIVE_RATIO: '0.55'
          WF_MAX_OOS_DD: '35'
        run: |
          set -e
          echo '===== 1/4 DAILY MODEL RETRAIN ====='
          python daily_model_retrain.py
          echo '✅ モデル再学習ゲート完了（不合格時は前回modelを維持）'
          echo '===== 2/4 WALK-FORWARD ====='
          python walk_forward.py
          test -s walk_forward_all_candidates.csv
          echo '✅ walk_forward_all_candidates.csv 生成済み'
          echo '===== 3/4 ADVERSARIAL VALIDATION + MONTE CARLO ====='
          python adversarial_strategy_validator.py
          test -s adversarial_final_candidates.csv
          echo '✅ adversarial_final_candidates.csv 生成済み'
          echo '===== 3.5/4 OOS GATE DIAGNOSTIC ====='
          python adversarial_oos_diagnostic.py
          echo '✅ OOSゲート診断完了'
          echo '===== 4/4 BUILD VERIFIED POLICY ====='
          python build_strategy_policy.py
          test -s strategy_policy.json
          echo '✅ 検証済みpolicy生成完了'
      - name: Verify policy before TOP10
        env:
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path
          p = json.loads(Path('strategy_policy.json').read_text(encoding='utf-8'))
          if str(p.get('status', '')).upper() != 'APPROVED':
              raise SystemExit(f"❌ policyがAPPROVEDではありません: {p.get('status')}")
          if p.get('source') != 'adversarial_strategy_validator':
              raise SystemExit('❌ 検証パイプライン由来ではないpolicyです')
          if int(p.get('approval_signature_version', 0)) != 1:
              raise SystemExit('❌ policy承認署名バージョンが不正です')
          secret = os.getenv('AI_POLICY_SIGNING_SECRET', '').strip()
          if not secret:
              raise SystemExit('❌ AI_POLICY_SIGNING_SECRET 未設定。安全のため停止します')
          keys = ['status','updated_at','up_threshold','min_score_for_buy','nikkei_filter','atr_tp_multiplier','atr_sl_multiplier','hold_days','validation_signals','validation_win_rate','validation_avg_return','validation_pf','validation_dd','oos_signals','oos_win_rate','oos_avg_return','oos_pf','oos_dd','oos_validation_pf_ratio','mc_sizing','mc_10y_probability','mc_15y_probability','mc_20y_probability','mc_bankruptcy_probability','mc_p90_max_dd','strategy_name','source']
          covered = {k: p.get(k) for k in keys}
          payload = json.dumps(covered, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          expected = hmac.new(secret.encode('utf-8'), payload.encode('utf-8'), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(str(p.get('approval_signature','')), expected):
              raise SystemExit('❌ policy署名不一致。手動変更または検証証跡破損を検知')
          print('✅ policy検証OK → TOP10実行可能')
          PY
      - name: Run unified Profit Loop TOP10
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_POLICY_SIGNING_SECRET: ${{ secrets.AI_POLICY_SIGNING_SECRET }}
          AI_INITIAL_CAPITAL: '1000000'
          INTRADAY_FEE_RATE: '0.00055'
        run: python profit_top10_paper.py
      - name: Verify TOP10 paper state and monthly ledger
        run: |
          test -s profit_top10_paper_state.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('profit_top10_paper_state.json').read_text(encoding='utf-8'))
          positions = s.get('positions', [])
          if len(positions) > 10:
              raise SystemExit(f'❌ TOP10超過: {len(positions)}')
          print(f"✅ 仮想資産: {float(s.get('capital',0)):,.0f}円")
          print(f"✅ 最大DD: {float(s.get('max_dd',0)):.2f}%")
          print(f"✅ 保有ポジション: {len(positions)}/10")
          print(f"✅ 最終エントリー日: {s.get('last_entry_date')}")
          if Path('profit_top10_monthly_performance.csv').exists():
              print('✅ 月間損益台帳: profit_top10_monthly_performance.csv')
          PY
      - name: Persist validated model, policy and paper ledger
        if: success()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model.pkl 2>/dev/null || true
          git add strategy_policy.json 2>/dev/null || true
          git add profit_top10_paper_state.json 2>/dev/null || true
          git add profit_top10_paper_history.csv 2>/dev/null || true
          git add profit_top10_monthly_performance.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'ℹ️ commit対象の変更なし'
            exit 0
          fi
          git commit -m 'chore: persist validated model policy and TOP10 ledger [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ validated model / policy / TOP10 ledger push成功'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ push失敗'
          exit 1
      - name: Upload full pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profit-loop-top10-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            model.pkl
            walk_forward_all_candidates.csv
            adversarial_dev_all_results.csv
            adversarial_validation_results.csv
            adversarial_oos_results.csv
            adversarial_oos_diagnostics.csv
            adversarial_oos_near_miss.csv
            adversarial_final_candidates.csv
            strategy_policy.json
            daily_retrain_report.csv
            trade_feedback_report.csv
            profit_top10_paper_state.json
            profit_top10_paper_history.csv
            profit_top10_monthly_performance.csv
