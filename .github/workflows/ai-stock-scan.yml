name: AI Stock Scan - Profit Loop TOP10 Paper Trade

on:
  schedule:
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-ai-profit-loop
  cancel-in-progress: false

jobs:
  profit-loop-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests scikit-learn joblib jpholiday

      - name: Syntax check unified profit loop
        run: |
          python -m py_compile daily_directional_top1.py
          python -m py_compile profit_top10_paper.py
          python -m py_compile intraday_directional_top1_cycle.py

      - name: Verify 100 tickers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('daily_directional_top1.py').read_text(encoding='utf-8'))
          tickers = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'TICKERS':
                          tickers = ast.literal_eval(node.value)
          if tickers is None or len(tickers) != 100 or len(set(tickers)) != 100:
              raise SystemExit(f'❌ 100銘柄ユニバース不正: {0 if tickers is None else len(tickers)}')
          print('✅ 100銘柄・重複なし')
          PY

      - name: Verify optimizer policy is connected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('strategy_policy.json')
          if not p.exists():
              raise SystemExit('❌ strategy_policy.json がありません。Profit Optimizerを先に実行してください。')
          policy = json.loads(p.read_text(encoding='utf-8'))
          required = ['status','up_threshold','min_score_for_buy','nikkei_filter','atr_tp_multiplier','atr_sl_multiplier','hold_days']
          missing = [x for x in required if x not in policy]
          if missing:
              raise SystemExit('❌ policy不足: ' + ','.join(missing))
          if str(policy.get('status','')).upper() != 'APPROVED':
              raise SystemExit(f"❌ policyがAPPROVEDではありません: {policy.get('status')}")
          print('✅ Optimizer → strategy_policy.json → TOP10 が接続可能')
          print(json.dumps({k: policy[k] for k in required}, ensure_ascii=False, indent=2))
          PY

      - name: Run unified Profit Loop TOP10
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          AI_INITIAL_CAPITAL: '1000000'
          INTRADAY_FEE_RATE: '0.00055'
        run: python profit_top10_paper.py

      - name: Verify TOP10 paper state and monthly ledger
        run: |
          test -s profit_top10_paper_state.json
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('profit_top10_paper_state.json').read_text(encoding='utf-8'))
          positions = s.get('positions', [])
          if len(positions) > 10:
              raise SystemExit(f'❌ TOP10超過: {len(positions)}')
          print(f"✅ 仮想資産: {float(s.get('capital',0)):,.0f}円")
          print(f"✅ 最大DD: {float(s.get('max_dd',0)):.2f}%")
          print(f"✅ 保有ポジション: {len(positions)}/10")
          print(f"✅ 最終エントリー日: {s.get('last_entry_date')}")
          if Path('profit_top10_monthly_performance.csv').exists():
              print('✅ 月間損益台帳: profit_top10_monthly_performance.csv')
          PY

      - name: Commit paper ledger safely
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profit_top10_paper_state.json 2>/dev/null || true
          git add profit_top10_paper_history.csv 2>/dev/null || true
          git add profit_top10_monthly_performance.csv 2>/dev/null || true
          git add -u
          if git diff --cached --quiet; then
            echo 'ℹ️ commit対象の変更なし'
            exit 0
          fi
          git commit -m 'chore: update TOP10 profit loop paper ledger [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo '✅ TOP10 paper ledger push成功'
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo '❌ TOP10 paper ledger push失敗'
          exit 1

      - name: Upload profit loop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profit-loop-top10-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            profit_top10_paper_state.json
            profit_top10_paper_history.csv
            profit_top10_monthly_performance.csv
            strategy_policy.json
